l_english:

 #Nicknames
 nick_the_hawk_of_quraysh:0 "Saqr Quraysh"
 nick_the_hawk_of_quraysh_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] escaped the bloodthirsty swords and spears of the Abbasids that chased [CharYouHerHim(CHARACTER)] across from Syria to al-Andalus, where [CharYouSheHe(CHARACTER)] began [CharYourHerHis(CHARACTER)] dynasty's golden age in [GetTitleByKey('c_cordoba').GetNameNoTier].\n\nSo grand was this feat, that [CharYourHerHis(CHARACTER)] rival, the Abbasid Caliph al-Mansur, bestowed upon [CharYouHerHim(CHARACTER)] the epithet of '$nick_the_hawk_of_quraysh$' (The Falcon of Quraysh)."
 nick_avicenna: "Ibn Sina"
 nick_averroes: "Ibn Rushd"
 nick_alhazen: "Ibn al-Haytham"
 nick_ibn_battuta_desc: "A matronymic literally meaning "son of the duckling", refering to his mother Fatuma who was given the pet name of Battuta."
 
