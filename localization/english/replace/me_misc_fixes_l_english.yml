 #Legends
 legend_chapter_conclusion_new_faith:0 "With the [ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuterPlural] gathered and the Exegesis of the [ROOT.Legend.GetProperty( 'faith' ).Faith.ReligiousText|U] written anew, [ROOT.Legend.GetProperty( 'religion' ).Religion.GetNameNoTooltip|U] was at last restored in the vision of [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm]!"