 #Buildings
 building_type_the_friday_mosque_01:0 "Jameh Mosque of Isfahan"
 building_type_the_friday_mosque_01_desc:0 "#F The Jameh Mosque of Isfahan, otherwise known as the Friday Mosque, was built during the rule of the Umayyad dynasty. It is said that the Caliph personally made one of the pillars in the mosque. Before becoming a mosque, it is said that it used to be a house of worship for Zoroastrians.#!"

 #Decisions
 appoint_a_righteous_caliph_decision:0 "Appoint a Righteous [ROOT.Char.GetFaith.ReligiousHeadName]"
 
 #Events
 head_of_faith.0021.desc:0 "Rejecting the tawdry politics of the Sunnis and Shi'as has left [ROOT.Char.GetFaith.GetName] an adherent to the Muhakkima strand of Islam. However, the followers of our movement are confused on where we stand on the Muhakkima spectrum, do we consider ourselves Ibadis or are we our own people? and if so, who's leaders do we follow?"
 head_of_faith.0021.ME.a:0 "We are Ibadis, but our leaders are our own."

