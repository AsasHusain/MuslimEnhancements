l_english:

###
#Generic Kunya desc: "People know and refer to [CHARACTER.GetShortUINameNoTooltipNoFormat|U] by [CharYourHerHis(CHARACTER)] #EMP kunya#! of '$nick_PLACEHOLDER$' (PLACEHOLDER_TRANSLATION).
#Generic Regal name desc: "Common to the medieval Islamic tradition of taking a #EMP laqab#! (arabic epithet), [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] been given the honorific title of '$nick_PLACEHOLDER$' (PLACEHOLDER_TRANSLATION)."
###

 #Muslim Nicknames
 nick_the_missionary:0 "Da'i al-Kabir"
 nick_the_missionary_desc:1 "So great was [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s zeal that he will not rest whilst there is a soul unsaved by the light of [CHARACTER.GetFaith.GetName], and so he known as the 'Da'i al-Kabir' — the Greater Missionary — to differentiate him and his younger brother."

 nick_the_younger_missionary:0 "Da'i al-Saghir"
 nick_the_younger_missionary_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] known for championing the [CHARACTER.GetFaith.GetAdherentNameNoTooltip] cause, though less than [Select_CString( CHARACTER.IsLocalPlayer, 'your', 'his' )] brother, and thusly called as 'Da'i al-Saghir' — the Lesser Missionary."
 
 
 ##Decision Nicknames
 nick_saqr_al_andalus:0 "Saqr al-Andalus"
 nick_saqr_al_andalus_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] reunited al-Andalus and created a legacy that rose to rival that of The Falcon of Quraysh, and will forever be remembered as '$nick_saqr_al_andalus$' — the Falcon of al-Andalus."
 nick_falcon_of_al_andalus:0 "Wahdat al-Saqr"
 nick_falcon_of_al_andalus_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] reunited al-Andalus and created a legacy that rose to rival that of the Falcon of Quraysh."
 
 ##Miscellaneous Nicknames
 nick_ibn_abihi:0 "Ibn Abihi" # Ancestor of the Ziyadids
 nick_ibn_abihi_desc:1 "Despite the fact that [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] been acknowledged by [CharYourHerHis(CHARACTER)] half-brother to be the son of Abu Sufyan, many have refused to acknowledge it, and instead refer to [CharYouHerHim(CHARACTER)] as Ziyad '$nick_ibn_abihi$' — the Son of his Father."
 nick_al_ahwal:0 "al-Ahwal"
 nick_al_ahwal_desc:1 "It seems that [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] deformity is the only thing the world can see about [CharYouHerHim(CHARACTER)], [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] come to be known by the name '$nick_al_ahwal$' —  the Cross-Eyed."
 nick_al_ghaliz:0 "al-Ghaliz"
 nick_al_ghaliz_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] jowls have been reputed to disgorge whole chicken legs on occasion, and has become known as '$nick_al_ghaliz$' — the Fat."
 nick_al_aqta:0 "al-Aqta'"
 nick_al_aqta_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] missing arm is such a distinct feature that everyone calls [CharYouHerHim(CHARACTER)] '$nick_al_aqta$' — the One-Handed."
 nick_kaysan:0 "Kaysan"
 nick_kaysan_desc:1 "Nicknamed 'Kayyis' by Ali ibn Abi Talib for his cunning nature as a young boy, and when he became a man, the people would come to call him '$nick_kaysan$' — the Intelligent."
 nick_al_hasna:0 "al-Hasna'"
 nick_al_hasna_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] been blessed with a great beaty that is known all across the land, and to the people she is known as '$nick_al_hasna' — the Beautiful."
 nick_me_jahdha_at_tanburi:0 "Jahdha at-Tanburi"
 nick_me_jahdha_at_tanburi_desc:1 "Praised for his mastery of the lute and ridiculed for his big bulging eyes, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] become famous under the name of '$nick_me_jahdha_at_tanburi' — Jahdha the Lute Player."
 nick_al_waqashi:0 "al-Waqashi"
 nick_al_waqashi_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] hails from the Andalusian village of Waqash, near Toledo."
 nick_me_ibn_wafid:0 "Ibn Wafid"
 nick_me_ibn_wafid_desc:1 "A patronymic that translates to 'Son of Wafid', with Wafid being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s great-great-grandfather."
 nick_me_awaranshah:0 "Awar'anshah"
 nick_me_awaranshah_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has been raiding the Armenian with such success that the people have given him the awe-inspiring name of Awar'anshah - the King of the Looters."
 nick_me_ibn_sahib_al_salat:0 "Ibn Ṣaḥib aṣ-Ṣalat"
 nick_me_ibn_sahib_al_salat_desc:1 "A patronymic that translates to 'Son of the Master of Prayer', with the Master of Prayer being a position in the Western Islamic world for the man under the Imam responsible for leading the prayer, this man being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s ancestor."
 nick_me_ibn_rushd:0 "Ibn Rushd"
 nick_me_ibn_rushd_desc:1 "A patronymic that translates to 'Son of Rushd', with Rushd being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s grandfather."
 nick_me_ibn_rushd_al_hafid:0 "Ibn Rushd al-Hafid"
 nick_me_ibn_rushd_al_hafid_desc:1 "In order not to be confused with his illustrious grandfather, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] was given the name of 'Ibn Rushd the Grandson' with 'Ibn Rushd' being patronymic that translates to 'Son of Rushd'."
 nick_me_ibn_tufayl:0 "Ibn Tufayl"
 nick_me_ibn_tufayl_desc:1 "A patronymic that translates to 'Son of Tufayl', with Tufayl being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s great-great-grandfather."
 nick_me_ibn_mada:0 "Ibn Maḍā'"
 nick_me_ibn_mada_desc:1 "A patronymic that translates to 'Son of Maḍā', with Maḍā' being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s ancestor."
 nick_me_al_turki:0 "at-Turki"
 nick_me_al_turki_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is a Turk who hails from the nomadic steppes of Central Asia."
 nick_me_az_zajjaj:0 "az-Zajjaj"
 nick_me_az_zajjaj_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has dabbled in the art of glass-making and is well known as '$nick_me_az_zajjaj$' — the Glass-Maker."
 nick_me_al_jawhari:0 "al-Jawhawri"
 nick_me_al_jawhari_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is well known for his craft of precious jewellery and is famously refered to as '$nick_me_al_jawhari$' — the Jeweller."
 nick_me_ibn_al_dayah:0 "Ibn ad-Dayah"
 nick_me_ibn_al_dayah_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] was the son of the wet-nurse of a prominent ruler or official, and has become known as '$nick_me_ibn_al_dayah$' — Son of the Wet-Nurse."
 nick_me_ibn_abd_kan:0 "Ibn Abd Kan"
 nick_me_ibn_abd_kan_desc:0 "A patronymic that translates to "Son of the Little Servant", with Abd Kan being a combination of the Arabic word 'Abd' (Servant or Slave) and the Persian diminutive 'Kan'."
 nick_me_al_atrash:0 "al-Atrash"
 nick_me_al_atrash_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is deaf to the words of those around him as he quite literally lacks hearing, and has become known as '$nick_me_al_atrash$' — the Deaf."
 nick_me_al_asam:0 "al-'Aṣam"
 nick_me_al_asam_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is deaf to the words of those around him as he quite literally lacks hearing, and has become known as '$nick_me_al_asam$' — the Deaf."
 nick_me_al_tajir:0 "at-Tājir"
 nick_me_al_tajir_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] shrewdness in trade is well-known throught the land, they've come to call him '$nick_me_al_tajir$' — the Merchant."
 nick_me_abul_fawaris:0 "Abu'l Fawāris"
 nick_me_abul_fawaris_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumed or received the honorific '$nick_me_abul_fawaris$' — the Father of Knights."
 nick_me_al_saqlabi:0 "aṣ-Ṣaqlabi"
 nick_me_al_saqlabi_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] was once a slave of possibly Slavic origin."
 

 ##Hashimids
 nick_me_ibn_al_hanafiyyah:0 "ibn al-Hanafiyyah"
 nick_me_ibn_al_hanafiyyah_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is the only child of Ali ibn Abi Talib and Khawlah al-Hanafiyyah, and so he has been named '$nick_me_ibn_al_hanafiyyah$' — the Son of the Hanafi Woman."
 nick_me_al_muthanna:0 "al-Muthanna"
 nick_me_al_muthanna_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has been given the same name as his father, and in order to differentiate the two, he has been given the name '$nick_me_al_muthanna$' — the Secondary." 
 nick_al_kamil:0 "al-Kamil" #I couldn't find a real reason as to why he was called as such.
 nick_al_kamil_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] appears to be flawless to those around him, they have come to call him '$nick_al_kamil$' — the Perfect."
 nick_me_al_ukhaydir:0 "al-Ukhaydir"
 nick_me_al_ukhaydir_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] was raised in the the village of 'al-Ukhaydir' near Mecca, hence he has become attributed to village and recived the #EMP nisba#! of '$nick_me_al_ukhaydir$'."
 nick_me_as_saffak:0 "as-Saffāk"
 nick_me_as_saffak_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] known for [CharYourHerHis(CHARACTER)] bloodthirsty nature, and [CharHaveHas(CHARACTER)] become known as '$nick_me_as_saffak$', [CharYourHerHis(CHARACTER)] nickname comes from the term 'Saffāk ad-Dima'' — the Blood Shedder."
 nick_me_al_ukhaydir_as_saghir:0 "al-Ukhaydir aṣ-Ṣaghir"
 nick_me_al_ukhaydir_as_saghir_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] been given the same title as [CharYourHerHis(CHARACTER)] father, and [CharHaveHas(CHARACTER)] become known as '$nick_me_al_ukhaydir_as_saghir$' — the Younger Ukhaydir."
 nick_me_al_athram:0 "al-Athram"
 nick_me_al_athram_desc:1 "Known for his firmness, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] become known among the people as '$nick_me_al_athram$' — the Firm."
 nick_me_al_ghamr:0 "al-Ghamr"
 nick_me_al_ghamr_desc:1 "Known to overwhelming people with his kindness and generosity, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] become known among the people as '$nick_me_al_ghamr$' — the One Who Overwhelms With Good." 
 nick_me_tabataba:0 "Tabataba"
 nick_me_tabataba_desc:1 "Due to his peculiar lisp, which would cause him to pronounce the letter #EMP Qaf#! as #EMP Ta'#! and the word 'Qaba' as 'Taba', the people would come to know him as '$nick_me_tabataba$'."
 nick_me_al_hujwiri:0 "al-Hujwiri"
 nick_me_al_hujwiri_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] hails from the Hujwar, a region in the city of Ghazni."
 nick_me_al_uraydi:0 "al-'Urayḍi"
 nick_me_al_uraydi_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] migrated and established himself in the village of al-'Urayd near Medina, where he lived most of his life and became the village's Shaykh."
 nick_me_an_naqib:0 "an-Naqib"
 nick_me_an_naqib_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] migrated to the city of Basra in Iraq after the death of his father, where he was established as the Naqib — Prefect — of the descendants of Prophet Muhammad."
 nick_me_ar_rumi_hashimid:0 "ar-Rumi"
 nick_me_ar_rumi_hashimid_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s skin and blue eyes set him apart from the rest of his peers, who likened his appearance to that of the Romans."
 nick_me_al_muhajir_hashimid:0 "al-Muhajir"
 nick_me_al_muhajir_hashimid_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] emigrated from the city of Basra with 70 people due to the large amount of internal strife, bloodshed, and confusion in the region, and as such he became known as '$nick_me_al_muhajir_hashimid$' — the Emigrant."
 nick_me_kahli_qasam:0 "Khali' Qasam"
 nick_me_kahli_qasam_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] founded the town of Qasam in Hadhramaut, and became known as '$nick_me_kahli_qasam$' — the One Who Planted Qasam."
 nick_me_sahib_mirbat:0 "Ṣāhib Mirbāt"
 nick_me_sahib_mirbat_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] converted the Ibadis of Mirbāt in Dhofar to Sunni Islam and introduced the city to the Shafi'i school of law, as such he is known as '$nick_me_sahib_mirbat$' — the Man of Mirbāt."
 nick_me_al_faqih_al_muqaddam:0 "al-Faqih al-Muqaddam"
 nick_me_al_faqih_al_muqaddam_desc:1 "Due to his mastery of Islamic religious law and precedence that he was given throught his life, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] became known as '$nick_me_al_faqih_al_muqaddam$' — the Foremost Theologian."
 nick_me_ath_thair:0 "ath-Tha'ir"
 nick_me_ath_thair_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] rebelled against the Abbasid Caliphate and established his independence, being the first Hashimid to do so successfully, earning him the name $nick_me_ath_thair$ — the Rebel."
 nick_me_al_mukhayyit:0 "al-Mukhayyit"
 nick_me_al_mukhayyit_desc:1 "Known for asking for a needle whenever he's curing his patients, the people have come to know [CHARACTER.GetShortUINameNoTooltipNoFormat|U] as '$nick_me_al_mukhayyit$' — the Tailor."
 nick_me_al_araj:0 "al-A'raj"
 nick_me_al_araj_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has been characterized for his constant limp, and has become known as '$nick_me_al_araj$' — the Limping."
 nick_me_al_atraf:0 "al-Atraf"
 nick_me_al_atraf_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] was the first of Ali's children to not be born from first wife Fatima az-Zahra', as such he became known as '$nick_me_al_atraf$' — the One from the Side."
 nick_me_as_sufi:0 "aṣ-Ṣufi"
 nick_me_as_sufi_desc:0 "Known for his deep ascesticism and fondess for dressing in wolly clothing, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] has become known as '$nick_me_as_sufi$' — the Ascetic."
 nick_me_bugha_al_akbar:0 "Bugha al-Akbar"
 nick_me_bugha_al_akbar_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is known by the name of 'Bugha' and given the epithet of 'al-Akbar' — the Elder — to differentiate him from his younger cousin who holds the same name."
 nick_me_bugha_al_asghar:0 "Bugha al-Aṣghar"
 nick_me_bugha_al_asghar_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is known by the name of 'Bugha' and given the epithet of 'al-Aṣghar' — the Younger — to differentiate him from his older cousin who holds the same name."
 nick_me_taj_al_maali:0 "Taj al-Ma'ali"
 nick_me_taj_al_maali_desc:0 "For [CharYourHerHis(CHARACTER)] bravery and ability to subdue the rebellous tribes of Hejaz, the people have come to know [CHARACTER.GetShortUINameNoTooltipNoFormat|U] as '$nick_me_taj_al_maali$' — the Crown of Glory."
 nick_me_mutalim_al_ashbal:0 "Mu'tim al-Ashbal"
 nick_me_mutalim_al_ashbal_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] slew a lioness and orphaned her cubs, from that day forward his companions knew him as '$nick_me_mutalim_al_ashbal$' — He Who Orphans Lion Cubs."

 ##Idrisids
 nick_me_al_miqdam:0 "al-Miqdam"
 nick_me_al_miqdam_desc:1 "Even the mountains sing of [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] courage, naming [CharYouHerHim(CHARACTER)] '$nick_me_al_miqdam$' — the Courageous."
 nick_me_al_hajjam:0 "al-Hajjam"
 nick_me_al_hajjam_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s bloodshedding nature has been likened to that of the practice of Hijama — Wet Cupping, granting him the epithet of '$nick_me_al_hajjam$'."
 nick_me_kannun:0 "Kannun"
 nick_me_kannun_desc:1 "Friends and Foes across the land know [CHARACTER.GetShortUINameNoTooltipNoFormat|U] as '$nick_me_kannun$'."
 nick_me_abul_aysh:0 "Abu'l 'Aysh"
 nick_me_abul_aysh_desc:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] generosity has granted [CharYouHerHim(CHARACTER)] the kunya-epithet of '$nick_me_abul_aysh$' — the Father of Livelihood"
 nick_me_al_idrisi:0 "al-Idrisi"
 nick_me_al_idrisi_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] descended from the great Sharifi dynasty that once ruled Morocco, with the world knowing [CharYouHerHim(CHARACTER)] as '$nick_me_al_idrisi$'."
 
 
 ##Andalusian Umayyads
 nick_ad_dakhil:0 "ad-Dakhil" #Alternate nickname for Abd al-Rahman I, well known in the Arabic world
 nick_ad_dakhil_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] escaped the bloodthirsty swords and spears of the Abbasids who followed [CharYouHerHim(CHARACTER)] across [CharYourHerHis(CHARACTER)] great journey from al-Sham to al-Andalus, where he began [CharYourHerHis(CHARACTER)] dynasty's golden age in [GetTitleByKey('c_cordoba').GetNameNoTier].\n\nFrom that day forward, everyone has known [CharYouHerHim(CHARACTER)] as '$nick_ad_dakhil$' — the Entrant."
 nick_ar_ridha_umayyad:0 "ar-Riḍah" # ar-Ridha actually means Satisfaction or Contentment
 nick_ar_ridha_umayyad_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] always excelled in his ability to gain the satisfaction of [CharYourHerHis(CHARACTER)] Father and subjects, and so [CharYouSheHe(CHARACTER)] has become known as '$nick_ar_ridha_umayyad$' — the Satisfier."
 nick_ar_rabdhi:0 "ar-Rabḍi"
 nick_ar_rabdhi_desc:1 "The cruel punishments of crucifixion and exile laid upon the participants of 'The Revolt of ar-Rabḍa' stained [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] name for all of history."
 
 ##Abbasids
 nick_me_as_saffah:0 "as-Saffaḥ"
 nick_me_as_saffah_desc:1 "Having shed the blood of countless members of the Umayyad clan, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] gained a dreadful reputaion as ruthless man, earning him the name of '$nick_me_as_saffah$' — the Blood-Shedder."
 nick_me_harun_ar_rashid:0 "ar-Rashīd"
 nick_me_harun_ar_rashid_desc:1 "With many men attesting to [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s wisdom, courage, and intelligence after his victory over the Byzantines, [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s father saw the makings of a great ruler within his son, and decided to honor him by elevating his position and granting him the epithet of '$nick_me_harun_ar_rashid$' (The Rightly-Guided)."
 nick_me_al_mamuniyyah:0 "al-Ma'muniyyah"
 nick_me_al_mamuniyyah_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] considered to be one of the most famous singer-poets to ever grace Baghdad's court, quickly rising to become the Caliph al-Ma'mun's favourite concubine, and as such she is attributed to him." 
 nick_me_kab_al_baqar:0 "Ka'b al-Baqar"
 nick_me_kab_al_baqar_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] known by the name '$nick_me_kab_al_baqar$' — the Cows' Heel."
 
 ##Kinda Tribe
 nick_al_ashath:0 "al-Ash'ath"
 nick_al_ashath_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s constantly dishevelled appearance has become a mark of distinctiveness, the world has come to know him as '$nick_al_ashath$' — the One with the Dishevelled Hair."
 nick_akil_al_marar:0 "Akil al-Marār"
 nick_akil_al_marar_desc:1 "Either because he was the only one of his companions to survive and stave off hunger by eating bitter thristle, or because he was likened to the Camel which bares it's fangs after eating the bitter plant, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] has become known in Arabian folktales as '$nick_akil_al_marar$' — He Who Eats the Bitter Thristle."
 nick_al_maqsur:0 "al-Maqṣūr"
 nick_al_maqsur_desc:1 "Satisfied with the borders of the Kingdom inherited to him by [CharYourHerHis(CHARACTER)] father, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] has become known among the Arabs as '$nick_al_maqsur$' — the Satisfied."
 nick_al_jawn:0 "al-Jawn"
 nick_al_jawn_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] dark skin sets [CharYouHerHim(CHARACTER)] apart from [CharYourHerHis(CHARACTER)] peers, the world has come to know [CharYouHerHim(CHARACTER)] as '$nick_al_jawn$' — the Dark-Skinned."
 nick_al_harrab:0 "al-Ḥarrab"
 nick_al_harrab_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is known in the Arabian folktales as '$nick_al_harrab$'."
 nick_imru_al_qays:0 "Imru' al-Qays"
 nick_imru_al_qays_desc:1 "A famous Pre-Islamic Arabian poet, [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s epithet comes from the word Imru which translates to 'A man who has fallen upon hard times' and al-Qays which is a Pre-Islamic Arabian diety, hence the nickname '$nick_imru_al_qays$' roughly translates to — the Struggling Man of al-Qays."
 nick_az_zarqali:0 "az-Zarqali"
 nick_az_zarqali_desc:1 "Having chosen the trade of metalsmithing in [CharYourHerHis(CHARACTER)] early life and excelling in the art of engraving, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] would come to be known as '$nick_az_zarqali$' — the Engraver."
 nick_ibn_bajjah:0 "Ibn Bajjah"
 nick_ibn_bajjah_desc:1 "A patronymic that translates to 'Son of Bajjah', with Bajjah being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s great-grandfather."
 nick_me_al_anqar:0 "al-Anqar"
 nick_me_al_anqar_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] remaining eye gets a lot more attention than the pair of them ever did, and the world has come to know [CharYouHerHim(CHARACTER)] as '$nick_me_al_anqar$' — the One-Eyed."
 nick_al_walladah:0 "al-Walladah"
 nick_al_walladah_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has begotten far too many children to count, giving his the name of '$nick_al_walladah$' — the Birth-Giver."
 
 ##Azd Tribe
 nick_ma_asama_amer:0 "Mā' as-Samā'"
 nick_ma_asama_amer_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] provided the Arabian tribes with rainwater during seven years of drought and famine, since then he became known as '$nick_ma_asama$' — Water of the Sky."
 nick_ibn_durayd:0 "Ibn Durayd"
 nick_ibn_durayd_desc:1 "A patronymic that translates to 'Son of Durayd', with Durayd being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s grandfather."
 nick_me_al_abrash:0 "al-Abrash"
 nick_me_al_abrash_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] suffered from a skin condition known as vitiligo, and as such was likened to a spotted horse."
 
 ##Lakhmids
 nick_me_muhriq_al_awwal:0 "al-Muḥriq al-Awwal"
 nick_me_muhriq_al_awwal_desc:1 "Being the first King among his people to punish his enemies with flames and fiery hot brands, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] became known as '$nick_me_muhriq_al_awwal$' — the First Burner."
 nick_me_al_saih:0 "as-Sā'iḥ"
 nick_me_al_saih_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] abdicated his throne to lead an ascestic life wandering the earth, and has been remembered ever since as '$nick_me_al_saih$' — the Wanderer."
 nick_ma_asama_mawiyah:0 "Mā' as-Samā'"
 nick_ma_asama_mawiyah_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] was known for her immense beauty, so much so that it is said the Sassanid kings themselves brought her gifts to get closer to her and became known among the Arabs as '$nick_ma_asama_mawiyah$' — Water of the Sky."
 nick_ibn_ma_asama:0 "Ibn Mā' as-Samā'"
 nick_ibn_ma_asama_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s mother was named '$nick_ma_asama_mawiyah$' for her beauty."
 nick_me_muhriq_al_thani:0 "al-Muḥriq ath-Thani"
 nick_me_muhriq_al_thani_desc:1 "In vengence for the murder of his son, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] gathered a hundred members of the tribe of Banu Tamim and threw them into the fire, henceforth became known as '$nick_me_muhriq_al_thani$' — the Second Burner."
 nick_me_ibn_umamah:0 "Ibn Umamah"
 nick_me_ibn_umamah_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] and his half-brother were given the same name, and to differentiate the two they were named with their matronymics, with his brother being known as 'Ibn Hind' while he was refered to as '$nick_me_ibn_umamah$'."
 nick_me_qaniyat_al_urs:0 "Qaniyat al-'Urs"
 nick_me_qaniyat_al_urs_desc:1 "Satirized in a poem which describes him as a weak ruler, [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s name is forever attached to the insulting nickname of '$nick_me_qaniyat_al_urs$' — the Wedding's Singing Slave Girl."
 nick_me_al_maghrur:0 "al-Maghrur"
 nick_me_al_maghrur_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s infamous pride and arrogance granted him the name of '$nick_me_al_maghrur$' — the Arrogant."
 nick_me_al_ghadanfar:0 "al-Ghaḍanfar"
 nick_me_al_ghadanfar_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] bravery in battle earned him the moniker of '$nick_me_al_ghadanfar$' — the Lion."
 
 ##Ghaznavids
 nick_nasir_ad_din_ghaznavid:0 "Nāsīr ad-Dīn"
 nick_nasir_ad_din_ghaznavid_desc:1 "After aiding the Samanid sultan in crushing the rebels in Khorasan, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] earned the nickname of '$nick_nasir_ad_din_ghaznavid$' — the Supporter of the Faith."
 nick_saif_ad_dawla_ghaznavid:0 "Sayf ad-Dawlah"
 nick_saif_ad_dawla_ghaznavid_desc:1 "After aiding the Samanid sultan in crushing the rebels in Khorasan alongside [CharYourHerHis(CHARACTER)] father, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] earned the nickname of '$nick_saif_ad_dawla_ghaznavid$' — the Sword of the State."
 
 ##Mirdasids
 nick_asad_al_dawla_mirdasid:0 "Asad ad-Dawla" 
 nick_asad_al_dawla_mirdasid_desc:0 "In order to better [CharYourHerHis(CHARACTER)] relations with the prestigous leader of the Kilab tribe, the Fatimid Caliph al-Hakim has given [CHARACTER.GetShortUINameNoTooltipNoFormat|U] the honorific title of '$nick_asad_al_dawla_mirdasid$' —  the Lion of the State."
 nick_shibl_al_dawla_mirdasid:0 "Shibl al-Dawla" 
 nick_shibl_al_dawla_mirdasid_desc:1 "As a  tribute to [CharYourHerHis(CHARACTER)] late father, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] taken the honorific title of '$nick_shibl_al_dawla_mirdasid$' — the Lion Cub of the State."
 
 ##Sulayhids
 nick_al_mukarram:0 "al-Mukarram" 
 nick_al_mukarram_desc:1 "Common to the medieval Islamic tradition of taking a #EMP laqab#! (arabic epithet), [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] taken the honorific title of '$nick_al_mukarram$' — the Venerated."
 nick_al_hurrat_ul_malika:0 "al-Hurrat-ul Malika" #One of the nicknames of Arwa bint Ahmad, unused
 nick_al_hurrat_ul_malika_desc:1 "The people of [GetTitleByKey('k_yemen').GetNameNoTier] have come to love and adore [CHARACTER.GetShortUINameNoTooltipNoFormat|U], and having taken to calling [CharYourHerHimself(CHARACTER)] '$nick_al_hurrat_ul_malika$' — the Independant Queen."
 nick_malikat_saba:0 "Malikat Saba' aṣ-Ṣaghīrah" 
 nick_malikat_saba_desc:1 "The people of [GetTitleByKey('k_yemen').GetNameNoTier] have come view [CHARACTER.GetShortUINameNoTooltipNoFormat|U] with a great deal of love and adoration, thay have taken to calling [CharYouHerHim(CHARACTER)] '$nick_malikat_saba$' — the Little Queen of Sheba."
 nick_sayidda_al_hurra:0 "al-Sayyida al-Hurrah" 
 nick_sayidda_al_hurra_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] the first Muslim queen to have had recognition as a monarch, across the land she has become known as '$nick_sayidda_al_hurra$' — the Independent Lady."
 
 ##Qarmatians
 nick_isfahanist_mahdi:0 "al-Mahdi al-Isfahani"
 nick_isfahanist_mahdi_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] was believed to be 'God Incarnate' and the long awaited Mahdi by the Qarmatian leader Abu Tahir, who would abdicate his realm in favor of the 'Mahdi-Caliph'.\n\n[CHARACTER.GetShortUINameNoTooltipNoFormat|U] however would attempt to revive Zoroastrianism by creating his own sect and executed several nobles and members of Abu Tahir's Family, but soon enough he was ousted as a false Mahdi, which would force Abu Tahir to execute him and retake his postition as leader of the Qarmatians."
 
 ##Rassids
 nick_me_al_rassi:0 "ar-Rassi"
 nick_me_al_rassi_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] was raised in the the village of 'Wadi ar-Rass' near Medina, hence he has become attributed to village and recived the #EMP nisba#! of '$nick_me_al_rassi$'."
 nick_hadi_lil_haqq:0 "al-Hādī ilā'l-Ḥaqq"
 nick_hadi_lil_haqq_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] established the Zayidi Imamate in [GetTitleByKey('k_yemen').GetNameNoTier], and [CharHaveHas(CHARACTER)] become known as '$nick_hadi_lil_haqq$' — the Guider to the Truth."
 nick_muhtasib_mujahid:0 "al-Muhtasib al-Mujahid"
 nick_muhtasib_mujahid_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] was only an Imam in the sense that he was a protector of the community, but could not lead the prayer or pass legal sentences."
 
 ##Ahl Quraysh
 nick_as_siddiq:0 "aṣ-Ṣiddiq"
 nick_as_siddiq_desc:1 "When the Pagans of Quraysh accused Prophet Muhammad of lying, Abu Bakr declared "I hold witness that he spoke the truth", and so the Prophet bestowed upon him the epithet of '$nick_as_siddiq$' — the One Who Bears Witness to the Truth."
 nick_al_faruq:0 "al-Fārūq"
 nick_al_faruq_desc:1 "Among the early Muslims, there was no one that was known to be a more just and fair judge than Umar ibn al-Khattāb, and so he was known among his people as '$nick_al_faruq$' — the One Who Distinguishes Right from Wrong."
 nick_dhu_nurayn:0 "Dhū al-Nurayn"
 nick_dhu_nurayn_desc:1 "No other man has been married to two of the Prophet's daughters, and so Uthman came to be known as '$nick_dhu_nurayn$' — the One with the Two Lights."
 nick_az-zahra:0 "az-Zahrā"
 nick_az-zahra_desc:1 "Prophet Muhammad was quoted saying "Fatima blooms for the people of heaven as the stars bloom for the people of the earth", and so he gave his daughter the name '$nick_az-zahra$' — the Blossom."
 nick_me_ath_thani:0 "ath-Thani"
 nick_me_ath_thani_desc:1 "A pious and just ruler, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] was likened in his attributes to his revered great-grandfather Umar ibn al-Khattab, owing him the name [CHARACTER.GetShortUINameNoTooltipNoFormat|U] '$nick_me_ath_thani$' — the Second."
 nick_me_an_naqis:0 "an-Naqis"
 nick_me_an_naqis_desc:1 "Wanting to emulate his great predescessor, Umar ibn Abd al-Aziz, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] would reduce the salaries of the army that would come to resent him and refer to his as '$nick_me_an_naqis$' — the Deficient."
 nick_me_al_adl:0 "al-Adl"
 nick_me_al_adl_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] would cover the Holy Ka'bah of Mecca once a year and justly allow the rest of Quraysh to cover it the next year, as such they came to know him as '$nick_me_al_adl$' — the Just."
 nick_me_sayfullah_al_maslul:0 "Sayf Allah al-Maslul"
 nick_me_sayfullah_al_maslul_desc:1 "As recognition for his exceptional military prowess and his role in defending and expanding the early Islamic state, Prophet Muhammad bestowed upon [CHARACTER.GetShortUINameNoTooltipNoFormat|U] the famed epithet of '$nick_me_sayfullah_al_maslul$' — the Unsheathed Sword of Allah."
 nick_me_umm_al_khayr:0 "Umm al-Khayr"
 nick_me_umm_al_khayr_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is the mother of the Prophet's closest companion and first Rashidun Caliph Abu Bakr '$nick_as_siddiq$', as such she has been named '$nick_me_umm_al_khayr$' — the Mother of Goodness."

 ##Shia imams
 nick_zayn_al_abidin:0 "Zayn ul-Abidin"
 nick_zayn_al_abidin_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] devoted his life to worship and learning, earning him teh honorific of '$nick_zayn_al_abidin$' — the Ornament of the Worshipers."
 nick_al_baqir:0 "al-Baqir"
 nick_al_baqir_desc:1 "Known for his erudition and great knowledge, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] was know by the honorific of '$nick_al_baqir$' - A shortened form of 'Baqir al-'Ilm' — He Who Splits Knowledge Open."
 nick_as_sadiq:0 "aṣ-Ṣadiq"
 nick_as_sadiq_desc:1 "Known for his integrety and honesty, the world has come to know [CHARACTER.GetShortUINameNoTooltipNoFormat|U] as '$nick_as_sadiq$' — the Truthful."
 nick_al_kadhim:0 "al-Kadhim"
 nick_al_kadhim_desc:1 "Known for his patience and gentle disposition, the world has come to know [CHARACTER.GetShortUINameNoTooltipNoFormat|U] as '$nick_al_kadhim$' — the Forbearing."
 nick_al_ridha_imam:0 "al-Riḍa"
 nick_al_ridha_imam_desc:1 "It is said that [CHARACTER.GetShortUINameNoTooltipNoFormat|U] was liked and accepted by both his followers and opponents, and as such he was given the title of '$nick_al_ridha_imam$' — the Approved One."
 nick_al_jawwad:0 "al-Jawwad"
 nick_al_jawwad_desc:1 "Known for his generosity, the world has come to know [CHARACTER.GetShortUINameNoTooltipNoFormat|U] as '$nick_al_jawwad$' — the Generous."
 nick_al_hadi_imam:0 "al-Hadi"
 nick_al_hadi_imam_desc:1 "Known for his traits as a guide and a leader for his followers, the world has come to know [CHARACTER.GetShortUINameNoTooltipNoFormat|U] as '$nick_al_hadi_imam$' — the Guide."
 nick_al_askari:0 "al-Askari"
 nick_al_askari_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s name has become connected to the military encampment — Askar — where he was forced to live, and as such he world has come to know him as '$nick_al_askari$'."
 nick_me_al_mahdi_twelver:0 "al-Mahdi"
 nick_me_al_mahdi_twelver_desc:1 "Muhammad is, according to the $imami$, the long awaited 'Mahdi' — the Guided One.\n\nIt is believed that he is alive and in a period of Ghaybah — Occultation — but will return at the end of time to bring peace and justice to the Muslim world."
 nick_al_mubarak_ismaili:0 "al-Mubarak"
 nick_al_mubarak_ismaili_desc:1 "It is believed by [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s followers that he was designated as the successor to the Imamate by his father Ja'far as-Sadiq, and was given by him the honorific of '$nick_al_mubarak_ismaili$' — the Blessed One."
 nick_al_maktum_ismaili:0 "al-Maktum"
 nick_al_maktum_ismaili_desc:1 "Threatened by his uncle Muza al-Kadhim's supportors, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] fled his native city of Medina and went into hiding, acquiring the epithet of '$nick_al_maktum_ismaili$' — the Hidden One."
 nick_ahmad_al_wafi:0 "Aḥmad al-Wafi"
 nick_ahmad_al_wafi_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] took on the name of Aḥmad as a way of hiding himself from those who may do him harm, and upon succeeding his father as the Isma'ili Imam he took on the epithet of 'al-Wafi' — the Loyal."
 nick_muhammad_al_taqi:0 "Muhammad at-Taqi"
 nick_muhammad_al_taqi_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] took on the name of Muhammad as a way of hiding himself from those who may do him harm, and upon succeeding his father as the Isma'ili Imam he took on the epithet of 'at-Taqi' (The Pious)."
 nick_abdullah_al_radi:0 "Abdullah ar-Raḍi"
 nick_abdullah_al_radi_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] took on the name of Abdullah as a way of hiding himself from those who may do him harm, and upon succeeding his father as the Isma'ili Imam he took on the epithet of 'ar-Raḍi' (The Satisfied One)."
 nick_me_al_khayr:0 "al-Khayr"
 nick_me_al_khayr_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumed or received the honorific '$nick_me_al_khayr$' — the Good."
 nick_al_aftah:0 "al-Aftaḥ"
 nick_al_aftah_desc:1 "Either because he was broad-headed (#EMP Aftaḥ ar-Ra's#!) or because he was broad-footed (#EMP Aftaḥ ar-Rijlayn#!), the world has come to know [CHARACTER.GetShortUINameNoTooltipNoFormat|U] as '$nick_al_aftah$'."
 nick_al_mahdi_billah_fatimid:0 "al-Mahdi bi-llah"
 nick_al_mahdi_billah_fatimid_desc:1 "Although Isma'ili Shi'ism was built around the idea that his ancestor, Isma'il al-Mubarak, was the one true Mahdi, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] has instead declared himself the Mahdi and took on the honorific of '$nick_al_mahdi_billah_fatimid$' — the Rightly-Guided Through God."
 
 ##Ibadi imams
 nick_dhu_thafinat:0 "Dhu 'al-Thafināt"
 nick_dhu_thafinat_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] prostrated himself in prayer so frequently that [CharYouSheHe(CHARACTER)] developed calluses on [CharYourHerHis(CHARACTER)] forehead, leading to the name '$nick_dhu_thafinat$' — the One with the Calluses."
 nick_talib_al_haqq:0 "Talib al-Ḥaqq"
 nick_talib_al_haqq_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumed or received the honorific $nick_talib_al_haqq$ — Seeker of the Truth."
 
 ##Barghawata
 nick_salih_barghawata:0 "al-Mu'minin"
 nick_salih_barghawata_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] was the founder and self-proclaimed prophet of the Barghawata religion, he claimed that his coming was prophesized in the Qur'an by pointing to his newly acquired epithet '$nick_salih_barghawata$' — the Best of the Believers.\n\nHe kept his and his people's faith hidden, it was not until the reign of his grandson, Yunus, that the Barghwata religion was publicly proclaimed."
 nick_me_al_matghari:0 "al-Matghari"
 nick_me_al_matghari_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] hails from the Berber Matghara tribe."
 
 ##Ifrinids
 nick_sahib_al_himar:0 "Ṣāhib al-Ḥimār"
 nick_sahib_al_himar_desc:1 "In order to appear to [CharYourHerHis(CHARACTER)] followers as a humble messianic figure, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] dressed [CharYourHerHimself(CHARACTER)] in rags and prefered riding a donkey to a horse, which gave [CharYouHerHim(CHARACTER)] the nickname '$nick_sahib_al_himar$' — the Man on the Donkey."
 nick_al_habashi_al_aswad:0 "al-Ḥabashi al-Aswad"
 nick_al_habashi_al_aswad_desc:1 "A Zenata Berber born from the womb of a Black African slave, [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] dark skin sets [CharYouHerHim(CHARACTER)] apart from [CharYourHerHis(CHARACTER)] people, who have come to know [CharYouHerHim(CHARACTER)] as '$nick_al_habashi_al_aswad$' — the Black Ethiopian."
 nick_al_ama:0 "al-A'ma" 
 nick_al_ama_desc:1 "If [CharYourHerHis(CHARACTER)] blindness isn't enough of a reminder of what [CharYouSheHe(CHARACTER)] lacks, the world has given [CHARACTER.GetShortUINameNoTooltipNoFormat|U] the name '$nick_al_ama$' — the Blind."
 
 ##Sijilmasa
 nick_al_aswad:0 "al-Aswad"
 nick_al_aswad_desc:1 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] dark skin sets [CharYouHerHim(CHARACTER)] apart from [CharYourHerHis(CHARACTER)] peers, the world has come to know [CharYouHerHim(CHARACTER)] as '$nick_al_aswad$' — the Black."
 nick_al_wazir:0 "al-Wazir"
 nick_al_wazir_desc:1 "The people have come to know [CHARACTER.GetShortUINameNoTooltipNoFormat|U] for [CharYourHerHis(CHARACTER)] political role in the realm, across the land [CharYouSheHe(CHARACTER)] is known as '$nick_al_wazir$' — the Advisor."
 nick_al_muntasir:0 "al-Muntasir"
 nick_al_muntasir_desc:1 "Triumph comes naturally to [CHARACTER.GetShortUINameNoTooltipNoFormat], and the world has come to know [CharYouHerHim(CHARACTER)] as '$nick_al_muntasir$' — the Victorious."
 nick_ar_rustamiya:0 "ar-Rustamīya"
 nick_ar_rustamiya_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] is the daughter of the Rustamid Imam in Tahert, the people of Sijilmasa have come to know her as '$nick_ar_rustamiya$' — the Rustamid Woman."
 nick_ibn_ar_rustamiya:0 "Ibn ar-Rustamīya"
 nick_ibn_ar_rustamiya_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] and [CharYourHerHis(CHARACTER)] half-brother have been given the same name, and as a way of differentiating the two brothers apart, the people of Sijilmasa have come to know [CharYouHerHim(CHARACTER)] as '$nick_ibn_ar_rustamiya$' — the Son of the Rustamid Woman."
 nick_al_amir_sijilmasa:0 "al-Amīr"
 nick_al_amir_sijilmasa_desc:1 "The people of Sijilmasa supported [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] rule over that of [CharYourHerHis(CHARACTER)] father and brother, and as a way of reaffirming [CharYourHerHis(CHARACTER)] claim to the throne, they have come to call [CharYouHerHim(CHARACTER)] '$nick_al_amir_sijilmasa$' — the Emir."
 nick_al_mutazz:0 "al-Mu'tazz"
 nick_al_mutazz_desc:1 "The people love and hold [CHARACTER.GetShortUINameNoTooltipNoFormat|U] in high grace, they have come to know [CharYouHerHim(CHARACTER)] as '$nick_al_mutazz$' — the Adored." 
 nick_shakir_lillah:0 "al-Shakir li-llāh"
 nick_shakir_lillah_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] proclaimed [CharYourHerHimself(CHARACTER)] a Sunni Caliph, and in the tradition of the Abbasids, [CharYouSheHe(CHARACTER)] [CharHaveHas(CHARACTER)] given [CharYourHerHimself(CHARACTER)] the regal name of '$al-Shakir lillāh$' — the One Who is Thankful to God."
 nick_ibn_thakiyya:0 "Ibn Thakiyyah"
 nick_ibn_thakiyya_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] and [CharYourHerHis(CHARACTER)] half-brother have been given the same name, and as a way of differentiating the two brothers apart, the people of Sijilmasa have come to know [CharYouHerHim(CHARACTER)] as '$nick_ibn_thakiyya$' — the Son of Thakiyyah."
 
 ##Rustamids
 nick_al_farisi:0 "al-Fārisī"
 nick_al_farisi_desc:1 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] has traveled far from [CharYourHerHis(CHARACTER)] homeland in Persia, the locals have come to know [CharYouHerHim(CHARACTER)] as '$nick_al_farisi$' — the Persian."
 
 ## Sicilian Emirs Other
 nick_me_ibn_qurhub:0 "Ibn Qurhub"
 nick_me_ibn_qurhub_desc:1 "A patronymic that translates to 'Son of Qurhub', with Qurhub being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s ancestor."
 nick_me_ibn_khinzir:0 "Ibn Abi Khinzīr"
 nick_me_ibn_khinzir_desc:1 "A patronymic that translates literally to 'Son of the Father of the Pig', with Abi Khinzīr supposedly being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s grandfather."

 ## Sicilian Taifa Emirs
 nick_me_ibn_mankud:0 "Ibn Mankud"
 nick_me_ibn_mankud_desc:1 "A patronymic that translates to 'Son of Mankud', with Mankud being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s ancestor."
 nick_me_ibn_al_hawwas:0 "Ibn al-Ḥawwās"
 nick_me_ibn_al_hawwas_desc:1 "A patronymic that translates to 'Son of al-Ḥawwās', with al-Ḥawwās being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s ancestor."
 nick_me_ibn_ath_thumnah:0 "Ibn ath-Thumnah"
 nick_me_ibn_ath_thumnah_desc:1 "A patronymic that translates to 'Son of ath-Thumnah', with ath-Thumnah being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s ancestor."
 nick_me_ibn_al_maklati:0 "Ibn al-Maklātī"
 nick_me_ibn_al_maklati_desc:1 "A patronymic that translates to 'Son of al-Maklātī', with al-Maklātī being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s ancestor."
 nick_me_ibn_abbad:0 "Ibn 'Abbād"
 nick_me_ibn_abbad_desc:1 "A patronymic that translates to 'Son of 'Abbād', with 'Abbād being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s ancestor."
 nick_me_ibn_al_baba:0 "Ibn al-Ba'bā'"
 nick_me_ibn_al_baba_desc:1 "A patronymic that translates to 'Son of al-Ba'bā', with al-Ba'bā being [CHARACTER.GetShortUINameNoTooltipNoFormat|U]'s ancestor."

 ## Kalbid Emirs
 nick_me_al_akhal:0 "al-Akḥal"
 nick_me_al_akhal_desc:1 "The world has come to know [CHARACTER.GetShortUINameNoTooltipNoFormat|U] for the dark Koḥl that he frequently applies to darken his eyes."
 nick_me_as_samsam:0 "aṣ-Ṣamṣam"
