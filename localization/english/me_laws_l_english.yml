 # Shura Preferance
 me_shura_preferance:0 "[me_shura_preferance_laws_concept|E]"
 me_shura_preferance_singular:0 "[me_shura_preferance_law_concept|E]"
 me_shura_general_preferance_law:0 "General Shura"
 me_shura_general_preferance_law_effects:0 "[electors|E] will not prioritize any [skill|E] or aspect of a candidate, and will elect based on personal preferance."
 me_shura_judicial_preferance_law:0 "Judicial Shura"
 me_shura_judicial_preferance_law_effects:0 "[electors|E] will prioritize the [learning|E] [skill|E] and will be more likely to elect a candidate with scholarly [traits|E] and high [learning|E]."
 me_shura_militaristic_preferance_law:0 "Militaristic Shura"
 me_shura_militaristic_preferance_law_effects:0 "[electors|E] will prioritize the [martial|E] [skill|E] and will be more likely to elect a candidate with militaristic or warrior-like [traits|E] and high [martial|E]."

 game_concept_me_shura_preferance_law:0 "Shura Preferance Law"
 game_concept_me_shura_preferance_law_concept:0 "Shura Preferance Law"
 game_concept_me_shura_preferance_laws_concept:0 "Shura Preferance Laws"
 game_concept_me_shura_preferance_law_desc:0 "[rulers|E] with the Shura Elective [title_law|E] have an additional [law|E] which can influence the [electors|E]' choice of candidate based on their [skills|E] and [traits|E]."
 