 trait_track_hafidh:0 "Hafidh"
 trait_track_hafidh_desc:0 "#help You gain experience in this track by appointing a Hafidh court tutor and using the $become_hafidh_interaction$ [interaction|E].#!\n\nIn the name of Allah, the Most Gracious, the Most Merciful..."
 trait_hafidh_desc:0 "This Character has dedicated themselves to commiting the entire Qur'an to memory."
 trait_hafidh_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] aspires to completley memorize the Qur'an, but has yet to memorize any important chapters."
 trait_hafidh_1_character_normal_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] aspires to completely memorize the Qur'an, [ROOT.GetCharacter.GetSheHe] has memorized a good amount of chapters a small amount of Hadith."
 trait_hafidh_1_character_quranist_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] aspires to completely memorize the Qur'an and has memorized a good amount of chapters."
 trait_hafidh_2_character_normal_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has memorized a great portion of the Qur'an and Hadith, this already large feat has given great [ROOT.GetCharacter.GetHerHim] respect within the Islamic community."
 trait_hafidh_2_character_quranist_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has memorized a great portion of the Qur'an, this already large feat has given great [ROOT.GetCharacter.GetHerHim] respect within the Islamic community."
 trait_hafidh_3_character_normal_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has completely memorized the Qur'an, word by word, letter by letter, this grand acomplishment along with  [ROOT.GetCharacter.GetHerHis] extensive knowledge of the Hadith serves as a sign of [ROOT.GetCharacter.GetHerHis] knowledge and piety to those that look towards [ROOT.GetCharacter.GetHerHim] for spiritual guidance."
 trait_hafidh_3_character_quranist_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has completely memorized the Qur'an, word by word, letter by letter, this grand acomplishment serves as a sign of [ROOT.GetCharacter.GetHerHis] knowledge and piety to those that look towards [ROOT.GetCharacter.GetHerHim] for spiritual guidance."
 
 trait_me_hidden_imam:0 "Hidden Imam"
 trait_me_hidden_imam_desc:0 "This character is a Fatimid Imam in hiding who seeks to spread his faith and claim his rightful place as as Caliph of the Isma'ilis."
 trait_me_hidden_imam_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a Fatimid Imam in hiding who seeks to spread his faith and claim his rightful place as as Caliph of the Isma'ilis."
 trait_track_me_hidden_imam:0 "Hidden Imam"
 trait_track_me_hidden_imam_desc:0 "#help You gain experience in this track by using the Proselytize [decision|E] as an adventurer.#!\n\nLevel 1: #EMP Upon becoming landed, will gain the [GetTitleByKey('d_shiite').GetNameNoTier] [title|E].#!\nLevel 2: #EMP Can take the [GetDecisionWithKey('ME_become_ismaili_mahdi_decision').GetName] [decision|E].#!"
 me_become_ismaili_caliph_tooltip:0 "Upon becoming landed, will gain the [GetTitleByKey('d_shiite').GetNameNoTier] [title|E]"
 me_become_ismaili_mahdi_tooltip:0 "Can take the [GetDecisionWithKey('ME_become_ismaili_mahdi_decision').GetName] [decision|E]"
 
