 trait_ME_ismaili_mahdi_desc:0 "This character has proclaimed themselves to be the Mahdi, promising to lead the Isma'ili faithful to glory."
 trait_ME_ismaili_mahdi_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has proclaimed himself the Mahdi, promising to lead the Isma'ili faithful to glory."

