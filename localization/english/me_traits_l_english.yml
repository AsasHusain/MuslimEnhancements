l_english:
 ## Quraysh-related traits
 trait_muslim_lineage:0 "Islamic Lineage"
 
 trait_qurashi:0 "Qurayshi"
 trait_qurashiyya:0 "Qurayshiyya"
 trait_quraysh_desc:0 "The term Qurashi describes someone who descends from the legendary Quraysh Tribe of Arabia, though unlike a Sayyid, not descending directly from the Prophet Muhammad."
 trait_quraysh_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has the Blood of the Quraysh tribe flowing through [ROOT.GetCharacter.GetHerHis] veins."
 rich_presence_quraysh: "Having the blood of Quraysh running through [ROOT.Char.GetHerHis] veins as"

 trait_ubaydi:0 "'Ubaydi"
 trait_ubaydiyya:0 "'Ubaydiyya"
 trait_ubaydi_desc:0 "The term 'Ubaydi was attributed to members of the Fatimid dynasty, which was believed by several Islamic sects to have forged it's descent from the Prophet Muhammad."
 trait_ubaydi_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is believed to be a descendant of Prophet Muhammad, a claim which is disputed by many."

 ## Berberist religion traits
 trait_blood_of_salih:0 "Blood of Salih"
 trait_blood_of_salih_desc:0 "This character is a descendant of Salih ibn Tarif, the self-proclaimed berber prophet of the Barghawatian religion."
 trait_blood_of_salih_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has the Blood of the Barghawatian berber prophet, Salih ibn Tarif, flowing through [ROOT.GetCharacter.GetHerHis] veins."

 trait_blood_of_hamim:0 "Blood of Ḥa-Mim"
 trait_blood_of_hamim_desc:0 "This character is a descendant of Ḥa-Mim ibn Mann-Allah, the self-proclaimed berber prophet of the Ḥa-Mimist religion."
 trait_blood_of_hamim_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has the Blood of the Ḥa-Mimist berber prophet, Ḥa-Mim ibn Mann-Allah, flowing through [ROOT.GetCharacter.GetHerHis] veins."
 trait_blood_of_hamim_prophet_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is the Ḥa-Mimist berber prophet, and within his veins flow the revered blood that shall flow through all [ROOT.GetCharacter.GetHerHis] decendants."

 trait_blood_of_kadu:0 "Blood of Kadu"
 trait_blood_of_kadu_desc:0 "This character is a descendant of Kadu ibn Mu'arik, the berber prophet and mahdi of the Kaduist religion."
 trait_blood_of_kadu_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has the Blood of the Kaduist berber prophet, Kadu ibn Mu'arik, flowing through [ROOT.GetCharacter.GetHerHis] veins."
 trait_blood_of_kadu_prophet_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is the Kaduist berber prophet, and within his veins flow the revered blood that shall flow through all [ROOT.GetCharacter.GetHerHis] decendants."

 trait_hamimist_prophet:0 "Ḥa-Mimist Prophet"
 trait_hamimist_prophet_desc:0 "This character is the founder and self-proclaimed Berber Prophet of the Ḥa-Mimist religion."
 trait_hamimist_prophet_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is the founder and self-proclaimed Prophet of the Ḥa-Mimist religion."
 
 trait_kaduist_prophet:0 "Kaduist Prophet"
 trait_kaduist_prophet_desc:0 "This character is the Mahdi and Prophet of the Kaduist religion."
 trait_kaduist_prophet_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is the Mahdi and Prophet of the Kaduist religion."

 ## Berber tribal traits
 trait_miknasa:0 "Miknasa"
 trait_miknasa_desc:0 "The Miknasa are members the ancient Miknasa Berber tribe."
 trait_miknasa_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] descends from the ancient Berber Miknasa tribe."

 trait_masmudi:0 "Masmuda"
 trait_masmudi_desc:0 "The Masmuda are members the ancient Masmuda Berber tribe, who possess the blood of Masmud ibn Yunus ibn Barbar"
 trait_masmudi_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] descends from the ancient Berber Masmuda tribe."

 trait_sanhaja:0 "Sanhaja"
 trait_sanhaja_desc:0 "The Sanhaja are members the ancient Sanhaja Berber tribe, who possess the blood of Sanhaj ibn Barnis ibn Mazigh"
 trait_sanhaja_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] descends from the ancient Berber Sanhaja tribe."

 trait_zenata:0 "Zenata"
 trait_zenata_desc:0 "The Zenata are members the ancient Zenata Berber tribe, who possess the blood of Jana/Shana, a descendant of Kadad ibn Mazigh"
 trait_zenata_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] descends from the ancient Berber Zenata tribe."
 
 trait_kutama:0 "Kutama"
 trait_kutama_desc:0 "The Kutama are members the ancient Kutama Berber tribe, who possess the blood of Kutama ibn Barnis ibn Mazigh."
 trait_kutama_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] descends from the ancient Berber Kutama tribe."
 
 trait_hawwara:0 "Hawwara"
 trait_hawwara_desc:0 "The Hawwara are members the ancient Hawwara Berber tribe, who possess the blood of Hawwar ibn Awrigh ibn Barnis ibn Mazigh."
 trait_hawwara_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] descends from the ancient Berber Hawwara tribe."
 
