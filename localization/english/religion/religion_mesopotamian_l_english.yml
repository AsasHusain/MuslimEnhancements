 shamsi_pagan_desc:0 "The Shamsiyah, otherwise known as Shamsis, are an ancient sect dedicated to the worship of the Mesopotamian sun god Shamash, whom they venerate by worshipping the sun. Little has been revealed about the practices of the Shamsis to the world, but they are known to pray in the direction of the sun and pull the hair from their dead to prepare their bodies for the next life."

