 kapalika_desc:0 "Kapalika Shaivites are a sect of ascetics who revere Shiva's fierce Bhairava form, and seek to emulate his behavior and characteristics through transgressive rituals such as human sacrifice, indulgence in alcohol and meat, and orgiastic sexuality."

