 barghawata_adherent_plural:0 "Barghawata"
 barghawata_desc:0 "Founded by the self-proclaimed mahdi and prophet Ṣāliḥ ibn Tarīf, Barghawatism is a heavily altered and berberized form of the Islam mixed in with traditional Berber mythology, it's adherants refer to God by his berber name, Yakush, and have their own Qur'an written in the Berber language and includes an additional 80 chapters."
