 tenet_zuhd_name:0 "Zuhd"


 ## Hostility Doctrines ## 
 #Ibadism/Wahbism Hostility
 special_doctrine_is_ibadi_faith_name:0 "Ahl al-Istiqama"
 is_ibadi_faith_name:0 "$special_doctrine_is_ibadi_faith_name$"
 special_doctrine_is_ibadi_faith_desc:0 "The distance between our communities may have forced us to adopt different leaders but our core teachings and identity remain the same, it does not matter where we are and who we follow, for in the end we are all Ahl al-Istiqama!"
 doctrine_parameter_hostility_override_special_doctrine_is_ibadi_faith:0 "Considers and is considered by [faiths|E] with the [GetFaithDoctrine('special_doctrine_is_ibadi_faith').GetBaseName] [doctrine|E], to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."

 ## Isma'ili Doctrines ##
 #Ubaydi Trait Acceptance
 special_doctrine_ubaydi_trait_acceptance_name:0 "The Fatimid Lineage"
 ubaydi_trait_acceptance_name:0 "$special_doctrine_ubaydi_trait_acceptance_name$"
 special_doctrine_ubaydi_trait_acceptance_desc:0 "While some may refuse to acknowledge the Fatimids as legitamate members of Ahl al-Bayt, claiming that their geneology was falsified, we accept their claims of lineage as the direct descendants of the Prophet."
 doctrine_parameter_ubaydi_trait_effects_active:0 "Characters with the [GetTrait('ubaydi').GetName( GetNullCharacter )] [trait|E] receive bonuses."

 #Musta'li Schism - Main
 special_doctrine_mustali_main_name:0 "Isma'ili Schism"
 mustali_main_name:0 "$special_doctrine_mustali_main_name$"
 special_doctrine_mustali_main_desc:0 "The succession of the Caliphate became muddy with the death of al-Amir and disappearance of his son, leaving the Ismaʿīlī community divided between the hope of a hidden heir and the search for a present leader. Thus giving rise to the Tayyibi and Musta'li branches."
 doctrine_parameter_mustali_main_effects_active:0 "[faiths|E] with [GetFaithDoctrine('special_doctrine_mustali_schismed_sect').GetBaseName] [doctrine|E] gain [EmptyScope.ScriptValue('mustali_schismed_sect_conversion_bonus_root_value')|=-%0] conversion speed against this [faith|E]"
 doctrine_parameter_hostility_override_special_doctrine_mustali_schismed_sect:0 "Considers [faiths|E] with [GetFaithDoctrine('special_doctrine_mustali_schismed_sect').GetBaseName] [doctrine|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."

 #Musta'li Schism - Sect
 special_doctrine_mustali_schismed_sect_name:0 "Musta'li Schism"
 mustali_schismed_sect_name:0 "$special_doctrine_mustali_schismed_sect_name$"
 special_doctrine_mustali_schismed_sect_desc:0 "The succession of the Caliphate became muddy with the death of al-Amir and disappearance of his son, leaving the Ismaʿīlī community divided between the hope of a hidden heir and the search for a present leader. Thus giving rise to the Tayyibi and Musta'li branches."
 doctrine_parameter_mustali_schismed_sect_effects_active:0 "[EmptyScope.ScriptValue('mustali_schismed_sect_conversion_bonus_root_value')|=+%0] conversion speed against the [GetFaithByKey('ismaili').GetAdjective] [faith|E]"
 doctrine_parameter_hostility_override_special_doctrine_mustali_main:0 "Considers [faiths|E] with the [GetFaithDoctrine('special_doctrine_mustali_main').GetBaseName] [doctrine|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 mustali_schismed_sect_conversion_task_desc:0 "Isma'ili sub-sect converting [GetFaithByKey('ismaili').GetAdherentNamePlural]"


 ## Succession Doctrines ##
 doctrine_parameter_sayyid_bonus_normal:0 "Normal [opinion|E] for [characters|E] with the [GetTrait('sayyid').GetName( GetNullCharacter )] [trait|E]."
 doctrine_parameter_sayyid_bonus_increased:0 "Slightly increased [opinion|E] for [characters|E] with the [GetTrait('sayyid').GetName( GetNullCharacter )] [trait|E]."
 doctrine_parameter_sayyid_bonus_increased_greatly:0 "Greatly increased [opinion|E] for [characters|E] with the [GetTrait('sayyid').GetName( GetNullCharacter )] [trait|E]."

 #Berberist (Barghawata)
 muhammad_succession_berberist_doctrine_name:0 "Berberist"
 muhammad_succession_berberist_doctrine_desc:0 "We care little for the views of foreigners and their false claims to leadership, for our leaders and the true successors to Muhammad are among the Amazigh."
 doctrine_parameter_hostility_override_muhammad_succession_berberist_doctrine:0 ""


 ## Islamic Secondary Sect Doctrines ##
 doctrine_islam_secondary_group_name:0 "Theological Affiliation" 
 REQUIRES_SUNNI:0 "Requires the [GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName] [doctrine|E]"
 REQUIRES_SHIA:0 "Requires the [GetFaithDoctrine('muhammad_succession_shia_doctrine').GetBaseName] [doctrine|E]"
 REQUIRES_MUHAKKIMA:0 "Requires the [GetFaithDoctrine('muhammad_succession_muhakkima_doctrine').GetBaseName] [doctrine|E]"
 REQUIRES_ZANDAQA:0 "Requires the [GetFaithDoctrine('muhammad_succession_zandaqa_doctrine').GetBaseName] [doctrine|E]"
 REQUIRES_BERBERIST:0 "Requires the [GetFaithDoctrine('muhammad_succession_berberist_doctrine').GetBaseName] [doctrine|E]"
 
 #Sunni Orthodoxy
 islam_secondary_group_sunni_orthodox_doctrine_name:0 "Sunni Orthodoxy"
 islam_secondary_group_sunni_orthodox_doctrine_desc:0 "Our schools of thought have developed closely alongside one another, and the differences of theology are far too minor to consider ourselves separate groups."
 doctrine_parameter_hostility_override_islam_secondary_group_sunni_orthodox_doctrine:0 "Considers [GetFaithDoctrine('islam_secondary_group_sunni_orthodox_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Unorthodox Sunnism
 islam_secondary_group_sunni_heresy_doctrine_name:0 "Unorthodox Sunni"
 islam_secondary_group_sunni_heresy_doctrine_desc:0 "Although we are Sunni by definition, our beliefs differ too much from those of the orthodoxy in order for us to consider ourselves as part of the same group, our relations still remain amicable, however."
 doctrine_parameter_hostility_override_islam_secondary_group_sunni_heresy_doctrine:0 "Considers [GetFaithDoctrine('islam_secondary_group_sunni_heresy_doctrine').GetBaseName] [faiths|E] with the to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Puritanical Sunnism
 islam_secondary_group_sunni_puritanical_doctrine_name:0 "Puritanical Sunni"
 islam_secondary_group_sunni_puritanical_doctrine_desc:0 "There is only one true path that Allah will accept, and there will be no compromise for the sake of the deviants."
 doctrine_parameter_hostility_override_islam_secondary_group_sunni_puritanical_doctrine:0 "Considers [GetFaithDoctrine('islam_secondary_group_sunni_puritanical_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 doctrine_parameter_me_puritanical_conversion_bonus_sunni:0 "[EmptyScope.ScriptValue('puritanical_islam_conversion_bonus_root_value')|=+%0] conversion speed against other [GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName] [faiths|E]"
 doctrine_parameter_me_puritanical_conversion_bonus_other_sunni:0 "[EmptyScope.ScriptValue('puritanical_islam_conversion_bonus_root_value')|=+%0] conversion speed against [GetFaithDoctrine('islam_secondary_group_sunni_puritanical_doctrine').GetBaseName] [faiths|E]"
 puritanical_islam_sunni_conversion_task_desc:0 "Puritanical Sunni converting or being converted by other Sunnis"
 
 #Shi'ite Affiliations
 islam_secondary_group_shia_orthodox_doctrine_name:0 "Shi'ite Affiliated"
 islam_secondary_group_shia_orthodox_doctrine_desc:0 "We acknowledge the rights of the Ahl al-Bayt and condemn their enemies, those who are akin to us may not always be perfect but they are better than most."
 doctrine_parameter_hostility_override_islam_secondary_group_shia_orthodox_doctrine:0 "Considers [GetFaithDoctrine('islam_secondary_group_shia_orthodox_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Batri Affiliations
 islam_secondary_group_shia_batriya_doctrine_name:0 "Batri Affiliated"
 islam_secondary_group_shia_batriya_doctrine_desc:0 "Although we hold that the only true successor to the Prophet is the Imam Ali, we do not view the Sunni Caliphs to be disbelievers, as they were virtuous and just rulers who played a crucial role in spreading Islam."
 doctrine_parameter_hostility_override_islam_secondary_group_shia_batriya_doctrine:0 "Considers [GetFaithDoctrine('islam_secondary_group_shia_batriya_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Puritanical Shi'ism
 islam_secondary_group_shia_puritanical_doctrine_name:0 "Puritanical Shi'ite"
 islam_secondary_group_shia_puritanical_doctrine_desc:0 "There is only one true path that Allah will accept, and there will be no compromise for the sake of the deviants."
 doctrine_parameter_hostility_override_islam_secondary_group_shia_puritanical_doctrine:0 "Considers [GetFaithDoctrine('islam_secondary_group_shia_puritanical_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 doctrine_parameter_me_puritanical_conversion_bonus_shia:0 "[EmptyScope.ScriptValue('puritanical_islam_conversion_bonus_root_value')|=+%0] conversion speed against other [GetFaithDoctrine('muhammad_succession_shia_doctrine').GetBaseName] [faiths|E]"
 doctrine_parameter_me_puritanical_conversion_bonus_other_shia:0 "[EmptyScope.ScriptValue('puritanical_islam_conversion_bonus_root_value')|=+%0] conversion speed against [GetFaithDoctrine('islam_secondary_group_shia_puritanical_doctrine').GetBaseName] [faiths|E]"
 puritanical_islam_shia_conversion_task_desc:0 "Puritanical Shi'ite converting or being converted by other Shi'ites"
 
 #Moderate Muhakkima
 islam_secondary_group_muhakkima_moderate_doctrine_name:0 "Moderate Muhakkima"
 islam_secondary_group_muhakkima_moderate_doctrine_desc:0 "Although we share a common origin point, we do not agree with the other extremist Muhakkima who condemn the other sects to death for their act of disbelief."
 doctrine_parameter_hostility_override_islam_secondary_group_muhakkima_moderate_doctrine:0 "Considers [GetFaithDoctrine('islam_secondary_group_muhakkima_moderate_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Puritanical Muhakkima
 islam_secondary_group_muhakkima_puritanical_doctrine_name:0 "Puritanical Muhakkima"
 islam_secondary_group_muhakkima_puritanical_doctrine_desc:0 "There is only one true path that Allah will accept, and there will be no compromise for the sake of the deviants."
 doctrine_parameter_hostility_override_islam_secondary_group_muhakkima_puritanical_doctrine:0 "Considers [GetFaithDoctrine('islam_secondary_group_muhakkima_puritanical_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 doctrine_parameter_me_puritanical_conversion_bonus_muhakkima:0 "[EmptyScope.ScriptValue('puritanical_islam_conversion_bonus_root_value')|=+%0] conversion speed against other [GetFaithDoctrine('muhammad_succession_muhakkima_doctrine').GetBaseName] [faiths|E]"
 doctrine_parameter_me_puritanical_conversion_bonus_other_muhakkima:0 "[EmptyScope.ScriptValue('puritanical_islam_conversion_bonus_root_value')|=+%0] conversion speed against [GetFaithDoctrine('islam_secondary_group_muhakkima_puritanical_doctrine').GetBaseName] [faiths|E]"
 puritanical_islam_muhakkima_conversion_task_desc:0 "Puritanical Muhakkima converting or being converted by other Muhakkimas"
 
 #Unaffiliated Zandaqa
 islam_secondary_group_zandaqa_unaffiliated_doctrine_name:0 "Unaffiliated"
 islam_secondary_group_zandaqa_unaffiliated_doctrine_desc:0 "Our theology and beliefs are far too disconnected from the other sects for us to be considered part of any of their groups."
 doctrine_parameter_hostility_override_islam_secondary_group_zandaqa_unaffiliated_doctrine:0 "Considers [GetFaithDoctrine('islam_secondary_group_zandaqa_unaffiliated_doctrine').GetBaseName] [faiths|E] [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Ghulat
 islam_secondary_group_zandaqa_ghulat_doctrine_name:0 "Ghulat"
 islam_secondary_group_zandaqa_ghulat_doctrine_desc:0 "Though we may trace the line of the Prophet correctly or not matters little to other Muslims, for our belief in the divine nature of the Imams mark us as outcasts regardless. Let the other so-called 'believers' call us Ghulāt — Exaggerators, we merely afford the true heirs of the Prophet the full respect they are due!"
 doctrine_parameter_hostility_override_islam_secondary_group_zandaqa_ghulat_doctrine:0 "Considers [GetFaithDoctrine('islam_secondary_group_zandaqa_ghulat_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Qarmatian
 islam_secondary_group_zandaqa_qarmatian_doctrine_name:0 "Qarmatian"
 islam_secondary_group_zandaqa_qarmatian_doctrine_desc:0 "A splinter group of the original Isma’ili Shi’ites, The Qarmatians have been known to attack the holy cities of Islam which has made them reviled by the all the Muslim sects."
 doctrine_parameter_hostility_override_islam_secondary_group_zandaqa_qarmatian_doctrine:0 "Considers [GetFaithDoctrine('islam_secondary_group_zandaqa_qarmatian_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 
 #Unaffiliated Berberist
 islam_secondary_group_berberist_doctrine_name:0 "Unaffiliated"
 islam_secondary_group_berberist_doctrine_desc:0 "Our theology and beliefs are far too disconnected from the other sects for us to be considered part of any of their groups."
 doctrine_parameter_hostility_override_islam_secondary_group_berberist_doctrine:0 "Considers [GetFaithDoctrine('islam_secondary_group_berberist_unaffiliated_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 

 ## Prohibition Doctrines ##
 doctrine_me_intoxication_name:0 "Alcohol Consumption"
 NO_HEDONISTIC:0 "The $tenet_hedonistic_name$ [core_tenet|E] must not be selected" 
 REQUIRES_HEDONISTIC:0 "Requires the [core_tenet|E] $tenet_hedonistic_name$"

 #Crimial Intoxication/Enforced Prohibition
 doctrine_me_intoxication_crime_name:0 "Criminal"
 doctrine_me_intoxication_crime_desc:0 "Intoxication is an enemy to all that is wise and good, virtuous and comely in man, that every one ought to rise with indignation against it as a most destructive and pernicious evil."
 doctrine_me_intoxication_crime_islamic_name:0 "Enforced Prohibition" 
 doctrine_me_intoxication_crime_islamic_desc:0 "[ROOT.Faith.HighGodNamePossessive] verses are clear, intoxicants are forbidden to us as they pose a danger to us and our society, all who willingly participate in it's consumption must be punished" 
 doctrine_parameter_me_intoxication_illegal:0 "[characters|E] with the [GetTrait('drunkard').GetName( GetPlayer )] [trait|E] are [criminals|E]"

 #Shunned Intoxication/Islamic Prohibition
 doctrine_me_intoxication_shunned_name:0 "Shunned" #Intoxication is a sin
 doctrine_me_intoxication_shunned_desc:0 "The followers of our faith must remain focused and wise in judgement, we cannot muddle our senses with spirits and liquor."
 doctrine_me_intoxication_shunned_islamic_name:0 "Islamic Prohibition"
 doctrine_me_intoxication_shunned_islamic_desc:0 "[ROOT.Faith.HighGodName] has forbidden intoxicants to us, they melt the mind and leave us blind in our judgement, and only those who have been blinded by them fail to see their vile nature." 
 doctrine_parameter_me_intoxication_shunned:0 "[characters|E] with the [GetTrait('drunkard').GetName( GetPlayer )] [trait|E] are [shunned|E]"

 #Accepted Intoxication
 doctrine_me_intoxication_accepted_name:0 "Accepted"
 doctrine_me_intoxication_accepted_desc:0 "How one wishes to govern themselves in the matter of drink is of little concern to us, however, they will still be held accountable for the decisions they make with a bottle in hand."
 doctrine_parameter_me_intoxication_accepted:0 "[characters|E] with the [GetTrait('drunkard').GetName( GetPlayer )] [trait|E] are fully accepted"

 #Virtuous Intoxication
 doctrine_me_intoxication_virtuous_name:0 "Virtuous"
 doctrine_me_intoxication_virtuous_desc:0 "To forbid ourselves from the pleasures of this world is a sin in and of itself, afterall, why would [ROOT.Faith.CreatorName] create drink for us if not to enjoy?"

 ## Ablution Doctrines ##
 doctrine_me_ablution_name:0 "Ablution Ritual"
 
 #No Ablution
 doctrine_me_ablution_none_name:0 "No Ablution Ritual"
 doctrine_me_ablution_none_desc:0 "We have no need to purify ourselves daily, doing so would be a waste of precious water."
 doctrine_parameter_me_ablution_none:0 "[characters|E] of this [faith|E] receive no bonuses"
 
 #Daily Handwashing
 doctrine_me_ablution_handwashing_name:0 "Daily Handwashing"
 doctrine_me_ablution_handwashing_desc:0 "We must cleanse our hands before every meal and every prayer, [ROOT.Faith.HighGodName] would not accept anything less."
 doctrine_parameter_me_ablution_handwashing:0 "Non-[GetTrait('cynical').GetName( GetNullCharacter )] [characters|E] of this [faith|E] are less likely to get infected by [epidemics|E]"
 
 #Partial Body Ablution/Wudhu/Rishama
 doctrine_me_ablution_full_name:0 "Partial Body Ablution"
 doctrine_me_ablution_full_desc:0 "This world is full of things that would leave a man tainted and filthy, it would be unbefitting of us to face [ROOT.Faith.HighGodName] in prayer with such filth on our bodies."
 doctrine_parameter_me_ablution_full:0 "Non-[GetTrait('cynical').GetName( GetNullCharacter )] [characters|E] of this [faith|E] are significantly less likely to get infected by [epidemics|E]"
 doctrine_me_ablution_wudhu_name:0 "Wudhu"
 doctrine_me_ablution_wudhu_desc:0 "Following the commandments of [ROOT.Faith.HighGodName], we must cleanse ourselves multiple times a day, meticulously cleaning our hands, face, arms, and feet as we must be pure when we offer ourselves to him in prayer."


 ## Islamic Faiths ## 
 #Wahbiya - North African Ibadi Islam
 wahbiya:0 "Wahbism"
 wahbiya_adj:0 "Wahbi"
 wahbiya_adherent:0 "Wahbi"
 wahbiya_adherent_plural:0 "Wahbis"
 wahbiya_desc:0 "The Wahbiyya are the followers of the North African branch of Ibadi Islam, they have their own leaders seperate from the distant imams in Oman, and eventually it's followers started to develop their own seperate teachings, taking the name 'al-Wahbiyya' from the Imam Abd al-Wahhāb Rustamid in Tahret."
 d_wahbiya:0 "Wahbi Imamate"
 d_wahbiya_article:0 "the "
 d_wahbiya_adj:0 "Wahbi"

 #Nukkari
 nukkari:0 "Nukkarism" #al-Nukkār
 nukkari_adj:0 "Nukkari"
