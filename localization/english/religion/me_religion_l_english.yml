 ishaqiya_desc:0 "The Ishaqiya, otherwise known as Ishaqites, are a school of thought which maintains that the title of door to the Imam Hasan al-Askari belongs to Abu Ya'qub Ishaq. This belief is in direct opposition to the Alawis."
 
 #Salihiyya (Tabiriyya/Batriyya)
 salihi:0 "Salihism"
 salihi_adj:0 "Salihi"
 salihi_adherent:0 "Salihi"
 salihi_adherent_plural:0 "Salihis"
 salihi_desc:0 "Also known as the Tabiriyya, the Salihiyya are a sub-sect of Zayidism who follow the teachings of Hasan ibn Salih al-Hamadani and Kathir an-Nawa al-Abtar. They believe that Abu Bakr, Umar, Uthman, and Aisha had been in error in failing to follow Imam Ali but it did not render them as disbelievers. In matters of jurisprudence, they share much in common with Sunni practice while maintaining their distinct Shi’a identity."

 #Karramiyya
 karrami:0 "Karramism"
 karrami_adj:0 "Karrami"
 karrami_adherent:0 "Karrami"
 karrami_adherent_plural:0 "Karramis"
 karrami_desc:0 "Founded by Muhammad ibn Karram in the 9th century, Karramism is a Sunni movement that was considered heretical by non-Karrami Sunnis for it's supposed anthropomorphisation of God. It was characterised by self-mortification, renunciation, and voluntary poverty that it's followers used order to get closer to Allah."

 ## Non-Islamic Faiths ##
 #Trika Shaivism (Kashmiri Shaivism)
 trika_shaivism:0 "Trika Shaivism"
 trika_shaivism_adj:0 "Trika"
