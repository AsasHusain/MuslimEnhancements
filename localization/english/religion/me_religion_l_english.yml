 ## Tenets ##
 tenet_puritanical_islam_name:0 "Fanatical Puritanicalism"
 tenet_puritanical_islam_desc:0 "The existence of the disbelieving idol worshippers and the sinful heretics who falsely refer to themselves as Muslims are an affront to Allah, they must be purged by fire and blood if need be."
 doctrine_parameter_hostility_override_tenet_puritanical_islam:0 "Considers and is considered by [faiths|E] with the [GetFaithDoctrine('tenet_puritanical_islam').GetBaseName] [doctrine|E], to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 REQUIRES_PURITANICAL_SECT:0 "Requires either the [GetFaithDoctrine('islam_secondary_group_sunni_puritanical_doctrine').GetBaseName], [GetFaithDoctrine('islam_secondary_group_sunni_puritanical_doctrine').GetBaseName], or [GetFaithDoctrine('islam_secondary_group_sunni_puritanical_doctrine').GetBaseName] [doctrines|E]"
