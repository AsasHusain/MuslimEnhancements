l_english:
 #Main Event
 alb_cm.0001.t:0 "Effects of The Fitnah and the Schism"
 alb_cm.0001.desc.intro:0 "Ever since the First Fitnah, the first Muslim civil war, the Muslims have been divided upon who the true successors of Prophet Muhammad and the rightful leaders of the Muslims are, the narratives of what happened to cause this succession problem differs too greatly between sects, it is the root of many sectarian conflicts, it is a schism that can never be mended.\n\nWhat can be mended however, is the relations between Muslims, this Faith was created as a compromise, as each group believes that the Prophet and those close to him backed their claims instead of that of others.\n\nThis faith is not meant to be played, only seen and observed as it is merely symbolic." 
 alb_cm.0001.desc.main:0 ""
 alb_cm.0001.desc.shia:0 ""
 alb_cm.0001.a:0 "Convert to an Islamic Faith"
 alb_cm.0001.tt.showlist:0 "Sends you to a list of Islamic faiths to choose from."
 alb_cm.0001.b:0 "Convert to the Faith of your capital"
 alb_cm.0001.c:0 "Kill off your Character"
 
 #Main List
 alb_cm.0002.t:0 "Islamic Faiths"
 alb_cm.0002.desc:0 "Faiths are in this list are grouped based on the Islamic Succession doctrine.\n\nIn the game, Ahl al-Sunnah are the largest group, followed by the Muhakkima and Shi'at 'Ali.\nIn modern times, Sunnis have remained the largest, while the Shi'ites became the second-largest."
 alb_cm.0002.a:0 "Ahl al-Sunnah"
 alb_cm.0002.tt.sunni:0 "Sends you to a list of Sunni faiths to choose from"
 alb_cm.0002.b:0 "Shi'at 'Ali"
 alb_cm.0002.tt.shia:0 "Sends you to a list of Shia faiths to choose from"
 alb_cm.0002.c:0 "Batriya"
 alb_cm.0002.tt.batriya:0 "Sends you to a list of Batriya faiths to choose from"
 alb_cm.0002.d:0 "Muhakkima"
 alb_cm.0002.tt.muhakkima:0 "Sends you to a list of Muhakkima faiths to choose from"
 alb_cm.0002.e:0 "Zandaqa"
 alb_cm.0002.tt.zandaqa:0 "Sends you to a list of Zandaqa faiths to choose from"
