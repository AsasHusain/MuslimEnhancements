 ## Hijri Calendar Game Rule
 rule_me_hijri_calendar:0 "@me_icon! Hijri Calendar"
 setting_me_hijri_enabled:0 "Enabled"
 setting_me_hijri_enabled_desc:0 "Muslim rulers will see the date displayed in the Hijri (Islamic) calendar format instead of the Gregorian calendar."
 setting_me_hijri_disabled:0 "#R Disabled#!"
 setting_me_hijri_disabled_desc:0 "All rulers will see the standard Gregorian calendar date."

