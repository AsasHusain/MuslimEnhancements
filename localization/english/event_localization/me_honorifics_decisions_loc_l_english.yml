 #Choose a Caliphal Honorific
 ##Main Decision
 CHOOSE_LAQAB_ENDING:0 "Choose Category"
 CHOOSE_LAQAB:0 "Choose #EMP Laqab#!"
 LAQAB_GLOSS: "A #bold Laqab#! is a usually compounded Arabic epithet taken as a show of prestige by rulers, statesmen, scholars, and many others in Muslim societies, it's origins lay in ancient Arabian culture in which descriptive nicknames were widely given to men of all types of social standings and it's first regnal use was by the early Abbasid Caliphs during 8th century."
