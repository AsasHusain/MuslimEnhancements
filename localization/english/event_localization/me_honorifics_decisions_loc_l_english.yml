 ME_choose_honorific_caliphal_main_desc:0 "The taking of a highly prestigous Caliphal Honorific or '[Glossary( 'Laqab', 'LAQAB_GLOSS' )]' has been tradition among Caliphs and Imams since the times of the early Abbasid Caliphs, if I take one it shall be the name the world will know and remember me by."
