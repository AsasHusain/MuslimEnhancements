l_english:
 #Choose a Himyarite Honorific
 ##Decision
 CHOOSE_HONORIFIC:0 "Choose Honorific"
 ME_choose_honorific_himyarite:0 "Choose a Himyarite Royal Honorific"
 ME_choose_honorific_himyarite_desc:0 "The old kings of Himyar once took on royal epithets as a show of status, perhaps by taking one myself I could draw some legitimacy from my Himyarite heritage."
