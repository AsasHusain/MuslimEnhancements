 ME_mustali_schism_convert_hafizi_option_tooltip: "The [GetFaithByKey('hafizi').GetAdjective] faithful believe that the true line of succession is through al-Hafiz, al-Amir's cousin."
 ME_mustali_schism_convert_hafizi_percent:0 "70% chance for every [GetFaithByKey('ismaili').GetAdjective] [county|E] in your [realm|E] to convert to [GetFaithByKey('hafizi').GetName]"
 ME_mustali_schism_convert_tayyibi_option: "[GetFaithByKey('tayyibi').GetNameNoTooltip]"
