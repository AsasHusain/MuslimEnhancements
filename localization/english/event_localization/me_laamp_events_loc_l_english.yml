l_english:
 # Laamp Intro events
 ## Cats Easteregg
 me_laamp_intro.0001.title:0 "The Lions' Adventure"
 me_laamp_intro.0001.desc:0 "On the promise of adventure, six men meet on the pilgrim’s road, between them a ballot is struck and a leader was chosen, his name was…"
 me_laamp_intro.0001.a:0 "Ya'qub 'Qamar ad-Din' Dibyazah"
 me_laamp_intro.0001.b:0 "Khalid Kashmiri"
 me_laamp_intro.0001.c:0 "Khidir Karawita"
 me_laamp_intro.0001.d:0 "Ismail Ahmad Kanabawi"
 me_laamp_intro.0001.e:0 "Uthman Abdul-Jalil Sisha"
 me_laamp_intro.0001.f:0 "Muhammad Sumbul"
 
 ## 1178 Buhturids (Arslanids)
 me_laamp_intro.0002.title:0 "The Last Sons of Buhtur"
 me_laamp_intro.0002.desc:0 "When the Franks invaded, [buhtur.GetFirstNameNicknamed] was left a young orphan and the last of a lineage in charge of only a portion of it’s ancestral domain, and yet he was able persevere and bring his house back from the brink of collapse.\n\nNow, it seems his grandson [hajji.GetFirstNameNicknamed] is in the same position after his three elder brothers were lured and killed by the Crusaders, but while Buhtur was left with a portion of his father’s domain, Hajji is left with none."
 me_laamp_intro.0002.a:0 "It’s over for [hajji.GetFirstNameNicknamed], [ali.GetFirstNameNicknamed] will have to save the house of Buhtur"
 me_laamp_intro.0002.b:0 "Perhaps [hajji.GetFirstNameNicknamed] can still save his family’s domains, somehow"
 me_laamp_intro.0002.tt:0 "#EMP The Arslanids, and later known as the Buhturids, were an Arab family claiming direct descendancy from the Lakhmid kings of al-Hira that were given lands in Southern Lebanon by the Abbasid Caliphs, they would continue to rule them without interruption until the First Crusade when Beirut and Sidon are taken by the Franks.\n\nIn 1187, [hajji.GetFirstNameNicknamed] would aid [saladin.GetTitledFirstNameNicknamed] in retaking Beirut and would have his ancestral domains returned to him, after which the Buhturids would remain in power with the favor of their liege lords until the Ottoman takeover of the region in the 16th century.\n\n[ali.GetFirstNameNicknamed] would manage to establish himself in Aramoun, independant from Hajji and the Buhturid domains.#!"
 
 
 # Hidden Imam events
 ## Decision
 ME_become_ismaili_mahdi_decision:0 "Proclaim Yourself the Mahdi"
 ME_become_ismaili_mahdi_decision_desc:0 "The Isma’ilis are weak, oppressed, and in hiding, divided by distance and doctrines they will need more than just an Imam who who's name and face they don't even know, they need a true leader, they need al-Mahdi - The Guided One."
 ME_become_ismaili_mahdi_decision_tooltip:0 "Embrace your destiny and become the Mahdi of the Isma'ilis"
 ME_become_ismaili_mahdi_decision_confirm:0 "Embrace Destiny"
 
 ## Events
 me_hidden_imam_event.0001.t: "A New Imam Rises"
 me_hidden_imam_event.0001.desc: "The late Imam has returned to Allah, now it is my turn to lead the Isma'ili community and pick up where he left off. Although he was unable to bring the Imamate out of hiding by establishing a venerable Isma'ili state, perhaps it shall be me who will return justice to this world."
 me_hidden_imam_event.0001.a: "Allahu Akbar!"
 me_hidden_imam_event.0002.t: "A New Caliphate"
 me_hidden_imam_event.0002.desc: "Ever since the flight of [maktum.GetTitledFirstNameNicknamed] from Medina, the Imamate has been forced into hiding from the many groups who seek to do us harm and thus leaving the majority of our community without a proper leader.\n\nThis ends today. By [reformer.GetFaith.HighGodNamePossessive] mercy, I've managed to establish a sublime state in [reformer.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]. With the backing of several respected scholars of the book, I have been recognized as the new Caliph of [reformer.GetFaith.GetName], and I am ready to lead my followers against the wicked heretics and idolaters still polluting this world!"
 me_hidden_imam_event.0002.a: "Allahu Akbar!"
 me_hidden_imam_event.0002.b:0 "It's time for the world to meet the Mahdi!"
 me_hidden_imam_event.0002.b.tt:0 "#EMP You will gain the choice to reform [reformer.GetFaith.GetName]#!"
 me_hidden_imam_event.0002.c:0 "It's time for me to correct the mistakes present within this community."
 me_hidden_imam_event.0002.c.tt:0 "#EMP You will get the chance to reform [reformer.GetFaith.GetName]#!"
 me_hidden_imam_event.0003.desc.ismaili: "Ever since the flight of [maktum.GetTitledFirstNameNicknamed] from Medina, the Imamate has been forced into hiding from the many groups who seek to do us harm and thus leaving the majority of our community without a proper leader.\n\nThis ends today. By [reformer.GetFaith.HighGodNamePossessive] mercy, [reformer.GetFirstName] established a sublime state in [reformer.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]. With the backing of several respected scholars of the book, [reformer.GetSheHe] has been recognized as the new Caliph of [reformer.GetFaith.GetName] and stands ready to lead [reformer.GetHerHis] followers against the wicked heretics and idolaters still polluting this world!"
 me_hidden_imam_event.0003.desc.other: "Ever since the flight of [maktum.GetTitledFirstNameNicknamed] from Medina, the [reformer.GetFaith.GetAdjective] Imamate has been forced into hiding and thus leaving their community without a proper leader.\n\nYet, it appears that they have finally come together once more, under the wise leadership of [reformer.GetFirstName]. After having established a state in [reformer.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] and having legitimized [reformer.GetHerHis] claim as new Caliph, [reformer.GetFirstName] stands ready to resume the great war against those who wronged them."
 me_hidden_imam_event.0003.a: "Allahu Akbar!"
 me_hidden_imam_event.0003.b: "Damned Infidels!"
 fervor_gain_created_ismaili_caliphate: "[ismaili_caliphate.GetName] restored"
 fervor_gain_new_ismaili_mahdi: "Mahdi Proclaimed"
 me_hidden_imam_event.1001.t: "The One Guided by God"
 me_hidden_imam_event.1001.desc: "Word is spreading like wildfire, al-Mahdi - The Guided One - is here and I have come to guide the world to the truth, at this very moment are journeying to spread my name to every corner of the world.\n\nAlthough most of the [ismaili_mahdi.GetFaith.GetAdjective] community has come to accept me as the Mahdi, some foolish groups such as the [GetFaithByKey('qarmatian').GetAdherentNamePlural] see ‘issues’ in my genealogy and claim that I am not a true descendant of the Prophet, they spew my name with the most vile of insults and make the wildest of claims to delegitimize my claim.\n\nNo matter, I stand firm with the bulk of the [ismaili_mahdi.GetFaith.GetAdherentNamePlural] behind me, and the disbelievers will be very regretful in the end."
 me_hidden_imam_event.1001.a: "Allahu Akbar!"
 me_hidden_imam_event.1001.b:0 "It's time for me to correct the mistakes present within this community."
 me_hidden_imam_event.1002.t: "$me_hidden_imam_event.1001.t$"
 me_hidden_imam_event.1002.desc: "Word has spread like wildfire, al-Mahdi - The Guided One - is here and he has come to guide the world to the truth, or at least that’s what the [ismaili_mahdi.GetFaith.GetAdherentNamePlural] are saying and they are keen on spreading the name of [ismaili_mahdi.GetName] to every corner of the world.\n\nAlthough most of the [ismaili_mahdi.GetFaith.GetAdjective] community has come to accept him as the Mahdi, some groups such as the [GetFaithByKey('qarmatian').GetAdherentNamePlural] who see issues in his genealogy believe he is not a true descendant of the Prophet and is nothing more than a liar who usurped the title of Mahdi. "
 me_hidden_imam_event.1002.a:0 "Damned Infidels!"
 me_hidden_imam_event.1002.b: "Allahu Akbar!"
 me_hidden_imam_event.1002.c: "This man is clearly a fraud!"
 ME_ismaili_mahdi_convert_qarmatian_percent:0 "50% chance for every [GetFaithByKey('ismaili').GetAdjective] [county|E] in your [realm|E] to convert to [GetFaithByKey('qarmatian').GetName]"
 me_hidden_imam_event.1003.t: "The Letter"
 me_hidden_imam_event.1003.desc: "The [ismaili_mahdi.GetFaith.GetAdjective] community is divided into several sub-sects, though each have their own set of differences they are ultimately part of the same group and my missionaries must help guide them to the true path ordained by Allah, and this shall be the message to help guide every righteous [ismaili_mahdi.GetFaith.GetAdjective].\n\nNow… to begin-"
 me_hidden_imam_event.1003.a: "There is no single path towards Allah…"
 me_hidden_imam_event.1003.b: "Our path is not the only one, but it is the most righteous…"
 me_hidden_imam_event.1003.c: "Our path is the only true path towards Allah…"
 me_hidden_imam_event.1004.t: "$me_hidden_imam_event.1003.t$"
 me_hidden_imam_event.1004.pluralistic: "Indeed, there are many paths towards Allah, and we cannot claim to be the most righteous… "
 me_hidden_imam_event.1004.righteous: "Indeed, though Allah may accept many paths, ours is the most righteous…"
 me_hidden_imam_event.1004.fundamentalist: "Indeed, it is folly to believe that Allah will accept more than one path, only our path will guide one to the truth…"
 me_hidden_imam_event.1004.a: "There have been many misconceptions about those who came before…"
 me_hidden_imam_event.1004.b: "The other Shi’ites may be on the wrong path, but they are closer to us than the rest…"
 me_hidden_imam_event.1004.c: "Shi’ite or not, we cannot tolerate the heresy committed by the other groups…"
 me_hidden_imam_event.1005.t: "$me_hidden_imam_event.1003.t$"
 me_hidden_imam_event.1005.batriya: "Though the first Sunni Caliphs were wrong in not acknowledging Ali as the true successor of the Prophet, they were not evil, and are not doomed to the hellfire..."
 me_hidden_imam_event.1005.orthodox: "The other Shi’ites may be wrong, but they are certainly more righteous than most…"
 me_hidden_imam_event.1005.puritanical: "Shia, Sunni, or Ibadi, they are all no different to one other, all heretics wallow in their heresy..."
 me_hidden_imam_event.1005.a: "We cannot hide anymore, every man must help spread our faith as far as possible."
 me_hidden_imam_event.1005.b: "We have many enemies, and if we must remain in hiding then that is what we shall do."
 me_hidden_imam_event.1005.c: "Our enemies will regret ever standing in our way!"
 me_hidden_imam_event.1005.d: "With fire and blood, we will purify this religion!"
 me_hidden_imam_event.1006.t: "$me_hidden_imam_event.1003.t$"
 me_hidden_imam_event.1006.desc: "And with this the letter is concluded…\n\nLet it be sent to every corner of the world.\n\nLet it be heard by every man, woman, and child.\n\nLet it be known that I, [ismaili_mahdi.GetName], am the one true Mahdi who will bring justice back into this world!"
 me_hidden_imam_event.1006.a: "Allahu Akbar!"