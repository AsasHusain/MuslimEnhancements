 ### Events
 me_missionary_event.0001.t:0 "Shepherdless Flock"
 me_missionary_event.0001.desc.dead:0 "[previous_holder.GetNameNoTooltip] is gone and [previous_holder.GetSheHe] leaves [previous_holder.GetHerHis] flock shepherdless, as I am now the leader of the camp [previous_holder.GetHerHis] followers will look towards me for guidance, hoping that I will continue in [previous_holder.GetHerHis] footsteps and become a missionary."
 me_missionary_event.0001.desc.alive:0 "[previous_holder.GetNameNoTooltip] is no longer the leader of the camp and cannot continue [previous_holder.GetHerHis] missionary work, which leaves [previous_holder.GetHerHis] flock shepherdless, as I am now the leader of the camp [previous_holder.GetHerHis] followers will look towards me for guidance, hoping that I will continue in [previous_holder.GetHerHis] footsteps and become a missionary."
 me_missionary_event.0001.a:0 "I shall continue your good work!"
 me_missionary_event.0001.b:0 "No, I have other ambitions."
 
 me_missionary_event.1001.t:0 "A Challenger Approaches"
 me_missionary_event.1001.desc.diplomacy:0 "My efforts recently have been a resounding success, with many being receptive to my words and opening their hearts to the light of [ROOT.Char.GetFaith.GetName].\n\nIt would all be perfect if not for [challenger.GetNameNoTooltip], a charismatic [challenger.GetWomanMan] who’s presence alone is enough to put a end to any progress made, men who’s hearts have almost embraced [ROOT.Char.GetFaith.GetName] found themselves swayed by [challenger.GetHerHis] honeyed words and turning away from the light.\n\nThe locals seem to have taken [challenger.GetHerHim] as their champion, should I wish to continue my progress I must shatter [challenger.GetHerHis] legitimacy infront of this crowd and force them to disperse."
 me_missionary_event.1001.desc.intrigue:0 "My efforts recently have been a resounding success, with many being receptive to my words and opening their hearts to the light of [ROOT.Char.GetFaith.GetName].\n\nIt would all be perfect if not for [challenger.GetNameNoTooltip], a sly local [challenger.GetFaith.GetAdherentName] who twists my words and spins lies against me, men who’s hearts almost saw the light found themselves blinded by [challenger.GetHerHis] lies.\n\nThe locals seem to have taken [challenger.GetHerHim] as their champion, should I wish to continue my progress I must shatter [challenger.GetHerHis] legitimacy infront of this crowd and force them to disperse."
 me_missionary_event.1001.desc.learning:0 "My efforts recently have been a resounding success, with many being receptive to my words and opening their hearts to the light of [ROOT.Char.GetFaith.GetName].\n\nIt would all be perfect if not for [challenger.GetNameNoTooltip], a local [challenger.GetFaith.PriestNeuterPlural] who’s made it [challenger.GetHerHis] mission to put an end to my activities, men who’s hearts have softened towards [ROOT.Char.GetFaith.GetName] turn to stone after being preached to by that deluded coon.\n\nThe locals seem to have taken [challenger.GetHerHim] as their champion, should I wish to continue my progress I must shatter [challenger.GetHerHis] legitimacy infront of this crowd and force them to disperse."
 me_missionary_event.1001.a:0 "The light of [ROOT.Char.GetFaith.HighGodName] shall prevail!"
 me_missionary_event.1001.b:0 "I've already done enough, I don't need to entertain this fool."
 
 me_missionary_event.1001.a.toast.debate_won:0 "You win the debate."
 me_missionary_event.1001.a.toast.debate_lost:0 "You lose the debate."
 
 me_missionary_event.1002.a.tt:0 "You manage to buy the conversions at half the required gold"
 me_missionary_event.1003.a.tt:0 "Your gold nets you twice the expected conversions"
 
 me_missionary_event.1004.t:0 "Leftover Gold"
 me_missionary_event.1004.desc:0 "It seems many in [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip] are willing to sell their allegiance for a mere bag of gold as our efforts have been quite successful, so successful in fact that we only spent only half the expected amount of gold.\n\nThere are many more people who’s conversion may be bought, alternatively we could simply keep what’s left of the gold in our pockets."
 me_missionary_event.1004.a:0 "There are many more men who's hearts can be bought."
 me_missionary_event.1004.b:0 "We shall keep the gold."
 
 me_missionary_event.1005.t:0 "A Moment for Indoctrination"
 me_missionary_event.1005.desc.diplomacy:0 "My recent efforts have been a resounding success, we’ve gained many adherents who have hidden the faith of [ROOT.Char.GetFaith.HighGodName] within their hearts.\n\nRecently, I’ve had my eye on a potential recruit who’s well liked by the community for [challenger.GetHerHis] quick wit and sharp tongue, a key factor that would be an aid in indoctrinating many of the locals into our group.\n\n[challenger.GetHerHis|U] heart appears sympathetic to the teachings of [ROOT.Char.GetFaith.GetName] and [challenger.GetHerHis] recruitment should be straightforward, but should this go awry the people will be very suspicious of my activities from now on."
 me_missionary_event.1005.desc.learning:0 "My recent efforts have been a resounding success, we’ve gained many adherents who have hidden the faith of [ROOT.Char.GetFaith.HighGodName] within their hearts.\n\nRecently, I’ve had my eye on a potential recruit who’s trusted by the community for [challenger.GetHerHis] vast intellect and wealth of knowledge, a key factor that would be an aid in indoctrinating many of the locals into our group.\n\n[challenger.GetHerHis|U] heart appears sympathetic to the teachings of [ROOT.Char.GetFaith.GetName] and [challenger.GetHerHis] recruitment should be straightforward, but should this go awry the people will be very suspicious of my activities from now on."
 me_missionary_event.1005.a.different_rel:0 "Tell me... have you heard of [ROOT.Char.GetFaith.HighGodName]?"
 me_missionary_event.1005.a.same_rel:0 "Tell me... have you heard of [ROOT.Char.GetFaith.GetName]?"
 me_missionary_event.1005.b:0 "It's not worth the risk."
 me_missionary_event.1005.a.toast.success:0 "You succeed in recruiting [challenger.GetHerHim]"
 me_missionary_event.1005.a.toast.fail:0 "You fail in recruiting [challenger.GetHerHim]"
 
 me_missionary_event.2001.a.tt:0 "You manage to gain more followers"
 
 me_missionary_event.2002.t:0 "The Calling"
 me_missionary_event.2002.desc:0 "#EMP ‘I can’t stand to be in this place any longer!’#! says [convert.GetNameNoTooltip], one of my early followers who has proven to be very receptive to the teachings of [ROOT.Char.GetFaith.GetName], #EMP ‘Please, let me come with you so that I may guide others to the light of [ROOT.Char.GetFaith.HighGodName] just as you have!’#!\n\n[convert.GetSheHe|U] seems quite enthusiastic about the idea of joining our group, but there may be more use to [convert.GetHerHim] here where [convert.GetSheHe] can help guide the other locals into the fold."
 me_missionary_event.2002.a:0 "Very well, you may come with us."
 me_missionary_event.2002.b:0 "You are more useful to us here."
 
 me_missionary_event.3001.a.tt:0 "You are pelted with rocks and forced to leave"
 
 me_missionary_event.3002.t:0 "Snake In The Grass"
 me_missionary_event.3002.desc:0 "I’m speaking to some of the locals in [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip] when I notice, out of the corner of my eye, a suspicious [roadman.GetWomanMan] slowly making [roadman.GetHerHis] way toward me. A quick glance reveals the strange look in [roadman.GetHerHis] eyes—enough to tell me everything I need to know.\n\nI stand ready as [roadman.GetSheHe] positions himself beside me, like a snake in the grass, poised to strike. Sure enough, [roadman.GetSheHe] grabs for [roadman.GetHerHis] waist, and a flash of white steel meets..."
 me_missionary_event.3002.a:0 "...my blade, ready to cut [roadman.GetHerHim] down."
 me_missionary_event.3002.b:0 "...my hand, shoving [roadman.GetHerHim] to the ground as I bolt out of there."
 me_missionary_event.3002.c:0 "...my bodyguard [bodyguard.GetNameNoTooltip], prepared to protect me."
 me_missionary_event.3002.a.toast.won:0 "You manage to defeat and kill your attacker"
 me_missionary_event.3002.a.toast.lost:0 "Your attacker gain the upper hand and defeats you"
 me_missionary_event.3002.a.toast.won_bodyguard:0 "Your bodyguard manages to defeat and kill your attacker"
 me_missionary_event.3002.a.toast.lost_bodyguard:0 "Your attacker gain the upper hand and defeats your bodyguard"

 me_missionary_event.3003.t:0 "Bloodthirsty Zealot"
 me_missionary_event.3003.desc:0 "I’m speaking to some of the locals in [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip] when, out of nowhere, a sharp pain suddenly erupts in my abdomen. My eyes widen in shock as I look down to see the glint of a blade embedded in my gut. I glance up to find a [roadman.GetWomanMan] with a wild look in [roadman.GetHerHis] eyes, poised to strike again.\n\nThe pain intensifies as I stumble backward, my mind racing to process what’s happening. But it’s already clear: I’m being attacked, and this [roadman.GetWomanMan] is trying to kill me."
 me_missionary_event.3003.a:0 "I have to defend myself!"
 me_missionary_event.3003.b:0 "[bodyguard.GetNameNoTooltip]! Help me!"
 me_missionary_event.3003.c:0 "I have to get out of here!"
 
 me_missionary_event.3004.t:0 "Boxed In"
 me_missionary_event.3004.desc:0 "I notice a pair of guards hastily approaching as I’m preaching to some of the locals in [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip], and it’s clear from their aggressive shouting and lowered spears they haven’t come to hear the rest of my sermon.\n\nI turn to escape only to spot another pair closing in from the other side, and it becomes clear that there is no other escape. It seems I've been boxed in."
 me_missionary_event.3004.a:0 "I can talk my way out of this."
 me_missionary_event.3004.b:0 "I'll have to fight my way out!"
 me_missionary_event.3004.c:0 "[bodyguard.GetNameNoTooltip]! Cover my escape!"
 me_missionary_event.3004.d:0 "Surely they'll let me go for a bag of gold."
 me_missionary_event.3004.a.toast.won:0 "You manage to convince the guards to let you go"
 me_missionary_event.3004.a.toast.lost:0 "You fail to convince the guards"
 me_missionary_event.3004.b.toast.won:0 "You manage to escape successfully"
 me_missionary_event.3004.b.toast.lost:0 "You are defeated by the guards"
 me_missionary_event.3004.c.toast.won:0 "Your bodyguard manages to defeat the guards"
 me_missionary_event.3004.c.toast.lost:0 "Your bodyguard is defeated"
 
 me_missionary_event.3005.t:0 "The Angry Heathen"
 me_missionary_event.3005.desc:0 "There are many things one must expect when preaching to the ignorant masses—stubbornness, insults, stones, and rotten fruit are among the most common. But above all, one must be prepared for physical aggression, which is exactly what I’m facing right now with the [assailant.GetWomanMan] in front of me.\n\nOur encounter began not too different from the others, with questions and a confrontation, followed by accusations and insults. But unlike the rest, this [assailant.GetWomanMan] hasn’t walked away—[assailant.GetSheHe]'s now in my face, ready to grab me by the neck."
 me_missionary_event.3005.a:0 "We can talk this out."
 me_missionary_event.3005.b:0 "Put that hand on me and you'll lose it!"
 me_missionary_event.3005.c:0 "[bodyguard.GetNameNoTooltip]! Protect me!"
 me_missionary_event.3005.a.toast.won:0 "You manage to talk [assailant.GetHerHim] down"
 me_missionary_event.3005.a.toast.lost:0 "The verbal confrontation escalates to a physical one"
 me_missionary_event.3005.b.toast.won:0 "You beat [assailant.GetHerHim] to a bloody pulp"
 me_missionary_event.3005.b.toast.lost:0 "You lose the fight"
 me_missionary_event.3005.c.toast.won:0 "Your bodyguard beats [assailant.GetHerHim] to a bloody pulp"
 me_missionary_event.3005.c.toast.lost:0 "Your bodyguard loses the fight"
 
 me_missionary_event.3006.a.tt:0 "The locals take the gold but continue to practice their old faith"
 
 me_missionary_event.3007.t:0 "The Tail"
 me_missionary_event.3007.desc:0 "I feel a wave of paranoid unease upon leaving a recent meeting with a potential recruit in [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip], as if foreign eyes are boring into my back. Yet when I look around, I see nothing.\n\nI try to shake the feeling and continue on but the persistent sense of unease never leaves my side. As I turn, my suspicions are confirmed—I meet the eyes of the [challenger.GetWomanMan] following me, and a strange look settles upon [challenger.GetHerHis] face as [challenger.GetSheHe] quickens [challenger.GetHerHis] pace to catch up to me."
 me_missionary_event.3007.a:0 "I have to get [challenger.GetHerHim] off my tail!"
 me_missionary_event.3007.b:0 "I'll make sure [challenger.GetSheHe] knows I'm not to be messed with."
 me_missionary_event.3007.a.toast.won:0 "You manage to lose your stalker"
 me_missionary_event.3007.a.toast.lost:0 "You are caught and imprisoned"
 me_missionary_event.3007.b.toast.won:0 "You win the confrontation and force [challenger.GetHerHim] to flee"
 me_missionary_event.3007.b.toast.lost:0 "You lose the confrontation and are imprisoned"
 
 me_missionary_event.3008.t:0 "An Ambush?"
 me_missionary_event.3008.desc:0 "I’ve recently received a tip from one of my contacts that some members of [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip]’s delegation are suspicious of my activities and may be attempting to set up an ambush for me.\n\nGoing into hiding would hurt my recruitment efforts, but working under such circumstances is dangerous and I may end up in the dungeons if I'm not careful."
 me_missionary_event.3008.a:0 "I'll continue working as I was."
 me_missionary_event.3008.b:0 "Too risky... I'll have to go into hiding."
 me_missionary_event.3008.a.toast.won:0 "You manage to evade capture"
 me_missionary_event.3008.a.toast.lost:0 "You are ambushed and caught"
 
 me_missionary_event.4001.a.tt:0 "Nobody is interested in listening"
 me_missionary_event.4002.a.tt:0 "You are chased away by a mob"
 me_missionary_event.4003.a.tt:0 "You are chased away by the guards"
 me_missionary_event.4004.a.tt:0 "You are robbed of a portion of your gold"
 
 me_missionary_event.5001.t:0 "Contacting the Community"
 me_missionary_event.5001.desc:0 "#weak You have the option to either contact your established communities or collect donations from them, by contacting a community you have the possibility of staving off the decay.#!"
 me_missionary_event.5001.a:0 "#V Contact Public Community#!"
 me_missionary_event.5001.b:0 "#V Contact Bought Community#!"
 me_missionary_event.5001.c:0 "#V Contact Secret Community#!"
 me_missionary_event.5001.d:0 "#weak Collect Donations#!"
 me_missionary_event.5001.e:0 "Another time perhaps..."
 me_missionary_event.5001.a.toast.won:0 "Sucessfully staved off decay"
 me_missionary_event.5001.a.toast.lost:0 "You are unsucessfully in staving off decay"
 me_missionary_event.5001.d.cooldown.tt:0 "You must wait a year before collecting donations again"
 me_missionary_event.5001.d.no_teirs.tt:0 "You have no communities here to collect from"
 