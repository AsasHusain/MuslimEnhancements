 ME_laamp_proselytize_public_preaching_option:0 "Preach Publicly"
 ME_laamp_proselytize_public_preaching_option_desc:0 "To speak the truth publicly is dangerous, as most would rather remain deaf to it..."
 ME_laamp_proselytize_public_preaching_option_tooltip:0 "Preaching publicly will utilize both your [diplomacy|E] and [learning|E], and the decay rate will progress normally."
 ME_laamp_proselytize_buy_conversions_option:0 "Buy Conversions"
 ME_laamp_proselytize_buy_conversions_option_desc:0 "All men like gold, perhaps it will ease the way for their souls to accept the truth..."
 ME_laamp_proselytize_buy_conversions_option_tooltip:0 "#V #Bold Cost: @gold_icon! [GetPlayer.MakeScope.ScriptValue('me_proselytize_buy_conversion_gold')]#!#!\n\nThe price of the conversion is determined by the development of the county and the social circle you've chosen to convert.\n\nBuying conversions will utilize both your [diplomacy|E] and [stewardship|E], and the decay rate will be half of what it normally is."
