l_english:
 
 ### Decision
 ME_laamp_proselytize:0 "Proselytize in [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip]"
 ME_laamp_proselytize_desc:0 "Guiding these souls will be a slow and difficult process, but in the end they will see that our path is just and true."
 ME_laamp_proselytize_tooltip:0 "You will attempt to guide these misguided [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] to the true path of [ROOT.Char.GetFaith.GetNameNoTooltip]"
 ME_laamp_proselytize_effect_tt:0 "You can increase the odds of coverting this [county|E] to [THIS.Char.GetFaith.GetName] by proselytizing to the different social circles of [THIS.Char.GetCurrentLocation.GetCounty.GetTitle.GetAdjective] society and recruiting them to your cause, with higher teirs granting higher odds of success:\n\n#weak #Bold @social_nobility_icon! Nobility#!: They represent the more infulential and higher ranking social groups of [THIS.Char.GetCurrentLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip], they grant the highest increase to the odds of conversion but are the most difficult to convert.\n#Bold @social_workers_icon! Workers#!: They represent the laborers, artisans, and soldiers of [THIS.Char.GetCurrentLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip], they grant a middling increase to the odds and a middling chance of successful conversion.\n#Bold @social_villagers_icon! Villagers#!: They represent the farmers, villagers, and those that live in the more isolated regions of [THIS.Char.GetCurrentLocation.GetCounty.GetTitle.GetBaseNameNoTierNoTooltip], they are by far the easiest to convert but grant the smallest increase to the odds of conversion.#!\n\nThese social circles can be converted by three methods, each utilizing [diplomacy|E] and another [skill|E] to achieve success:\n\n#weak #Bold @preach_conv_icon! Public Preaching#!: The tried and true method of open-air preaching, this option uses both your [diplomacy|E] and [learning|E] and is available to all missionaries except those that follow a secret faith.\n#Bold @buy_conv_icon! Buy Conversions#!: Gold is an easy way to inspire men to your side, but it cannot inspire devotion and as such these followers will decay at a faster rate than normal, this option uses both your [diplomacy|E] and [stewardship|E] and is available to all missionaries that have enough gold and do not follow a secret faith.\n#Bold @secret_conv_icon! Preach Secretly#!: In times of strife we may have to keep our true faith hidden from those that will seek us harm, this option uses both your [diplomacy|E] and [intrigue|E] and is only available to missionaries who's faith has the [GetFaithDoctrine('tenet_false_conversion_sanction').GetBaseName] [core_tenet|E] or follow a secret faith.\n\n#Bold Decay#!: Surrounded by hostile neighbours and opposing ideas, your followers will eventually lose their way or their life. Decay occurs to all of your communities and when they decays they will lose a single teir, this can be prevented by using the #Bold @contact_communities_icon! Contact Communities#! decision which allows you to stave off the decay. The decay rate can be affected by the hostility of the county's [faith|E], as [faith_astray|E] faiths will take twice as long to decay as opposed to [faith_hostile|E] and [faith_evil|E] faiths while [faith_righteous|E] faiths will not cause decay.#!"
 ME_laamp_proselytize_convert_county_option:0 "Convert The County"
 ME_laamp_proselytize_convert_county_option_desc:0 "I shall put all my efforts in bringing these people to the light."
 ME_laamp_proselytize_convert_county_option_tooltip:0 "This option will allow you to convert this entire county to your faith.\n\nYou will choose one of two methods to convert this county."
 ME_laamp_proselytize_preach_nobility_option:0 "Preach To The Nobility"
 ME_laamp_proselytize_preach_nobility_option_desc:0 "The higher classes will play a great role in the future of these lost souls."
 ME_laamp_proselytize_preach_nobility_option_tooltip:0 "This social circle represents the more infulential and higher ranking social groups, they grant the highest increase to the odds of conversion but are the most difficult to convert.\n\nYou will choose one of three methods to convert this social circle."
 ME_laamp_proselytize_preach_workers_option:0 "Preach To The Workers"
 ME_laamp_proselytize_preach_workers_option_desc:0 "I shall put all my efforts in bringing these people to the light."
 ME_laamp_proselytize_preach_workers_option_tooltip:0 "This social circle represents circle the laborers, artisans, and soldiers, they grant a middling increase to the odds and a middling chance of successful conversion.\n\nYou will choose one of three methods to convert this social circle."
 ME_laamp_proselytize_preach_villagers_option:0 "Preach To The Villagers"
 ME_laamp_proselytize_preach_villagers_option_desc:0 "I shall put all my efforts in bringing these people to the light."
 ME_laamp_proselytize_preach_villagers_option_tooltip:0 "This social circle the farmers, villagers, and those that live in the more isolated regions, they are by far the easiest to convert but grant the smallest increase to the odds of conversion.\n\nYou will choose one of three methods to convert this social circle."
 ME_CHOOSE_PROSELYTIZE_TARGET_OPTION:0 "Choose Proselytization Target"
