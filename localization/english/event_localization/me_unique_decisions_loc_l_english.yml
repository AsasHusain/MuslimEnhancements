 # Choose a faith for Persia
 choose_karrami_desc: "[GetFaithByKey('karrami').GetName]"
 choose_karrami_tooltip: "While the [GetFaithByKey('karrami').GetAdjective] [faith|E] is still subject to the [GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName] Caliph, it's beliefs are marked as heretical by the [GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName] orthodoxy and its members are heavily ostracized, which would grant us a great deal of autonomy."
 choose_karrami_name: "[GetFaithByKey('karrami').GetNameNoTooltip]"
 choose_salihi_desc: "[GetFaithByKey('salihi').GetName]"
 choose_salihi_tooltip: "The [GetFaithDoctrine('islam_secondary_group_shia_batriya_doctrine').GetBaseName] of the [GetFaithByKey('salihi').GetAdjective] [faith|E] offers us a middle position between the [GetFaithDoctrine('muhammad_succession_shia_doctrine').GetBaseName] and [GetFaithDoctrine('muhammad_succession_sunni_doctrine').GetBaseName] succession, which could allow us to appeal to both of these groups while being completely independent of the Caliphate."
 choose_salihi_name: "[GetFaithByKey('salihi').GetNameNoTooltip]"
 choose_ibadi_desc: "[GetFaithByKey('ibadi').GetName]"
 choose_ibadi_tooltip: "The [GetFaithByKey('ibadi').GetAdjective] [faith|E] has very little roots in Persia, but it's teaching emphasize the equality of all men regardless of their descendancy or heritage, which may help us in forming stronger bonds of unity between the diverse peoples of Persia."
 choose_ibadi_name: "[GetFaithByKey('ibadi').GetNameNoTooltip]"
 choose_urartuism_desc: "[GetFaithByKey('urartuism').GetName]"
 choose_urartuism_tooltip: "The [GetFaithByKey('urartuism').GetAdjective] [faith|E] has very ancient roots in both Persia and Armenia, by adopting it we could deeping the Armenian influence present in our people and Persia as a whole."
 choose_urartuism_name: "[GetFaithByKey('urartuism').GetNameNoTooltip]"
 choose_urartuism_must_be_armenian_tt:0 "Your [culture|E] must either be Armenian or descended from Armenian."
 choose_manichean_desc: "[GetFaithByKey('manichean').GetName]"
 choose_manichean_tooltip: "The appeal that the Abrahamic faiths has to the people of Persia is undeniable, and the [GetFaithByKey('manichean').GetAdjective] [faith|E] has strong influences from Abrahamic theology, by adopting it we would be taking a faith that is both appealling to the Persian people and Persian in nature."
 choose_manichean_name: "[GetFaithByKey('manichean').GetNameNoTooltip]"