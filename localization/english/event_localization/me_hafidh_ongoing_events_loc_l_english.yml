l_english:
 become_hafidh_ongoing.1000.t:1 "$become_hafidh$: The Ease of Youth"
 become_hafidh_ongoing.1000.desc:3 "My study of the Qur'an is progressing fantastically — I feel like I have all the focus and energy in the world! The holy words flow into my mind like water and out of my mouth with grace.\n\nI can memorize several new chapters with ease, all I have to do is just #EMP focus even harder#!, I'll be finished in no time at all!"
 become_hafidh_ongoing.1000.a:0 "I will dedicate #EMP all#! my time to this!"
 become_hafidh_ongoing.1000.b:0 "I'd rather spend my time elsewhere..."
 
 become_hafidh_ongoing.1010.t:1 "$become_hafidh$: The Hardships of Age"
 become_hafidh_ongoing.1010.desc:3 "With old age comes hardship, one that has manifested itself as weight upon my shoulders and a blockade upon mind as the years take their toll upon my aging memory.\n\nAs I continue in my attempt to memorize the Qur'an, my weakened memory offers me no favors, each verse feels like a fleeting wisp of memory slipping through my grasp, leaving behind a frustrating void and a sense of inadequacy.\n\nBy Allah... I don't know if I can do this."
 become_hafidh_ongoing.1010.a:0 "I can do this! I #EMP must#! do this!"
 become_hafidh_ongoing.1010.b:0 "I think it's time I rest my mind a while..."
 scheme_loses_some_progress:0 "The [scheme|E] loses some of its progress, but stays active"
 
 become_hafidh_ongoing.1020.t:1 "$become_hafidh$: Heretical Interpretation"
 become_hafidh_ongoing.1020.desc:3 "My recent studies with [target.GetFirstNameNoTooltip] have managed shed light to me of the many differences between [root.GetFaith.GetAdjective] and [target.GetFaith.GetAdjective] thought, and while my discussions with [target.GetHerHim] have never touched any of the more sensitive topics, today was different.\n\nAs [target.GetFirstNameNoTooltip] and I were engaging in our usual routine today, we stumble upon a section that is notorious for being a point of controversy between [root.GetFaith.GetAdjective] and [target.GetFaith.GetAdjective] scholars, and soon enough [target.GetFirstNameNoTooltip] goes into a rather long and #EMP deeply heretical#! explaination of the verses.\n\n"So you see [root.GetFirstNameNoTooltip], this is the true meaning of Allah's words." declares [root.GetFirstNameNoTooltip]."
 become_hafidh_ongoing.1020.a:0 "May I offer an alternative prespective?"
 become_hafidh_ongoing.1020.b:0 "You know... you are making some good points."
 become_hafidh_ongoing.1020.c:0 "...Can we just get back to what we were doing?"
 become_hafidh_ongoing.1020.a.conversion_succesful.t:0 "Conversion Successful"
 become_hafidh_ongoing.1020.a.conversion_succesful.desc:0 "You convert [target.GetHerHim]"
 become_hafidh_ongoing.1020.a.conversion_failed.t:0 "Conversion Failed"
 become_hafidh_ongoing.1020.a.conversion_failed.desc:0 "You fail to convert [target.GetHerHim]"
 scheme_gains_some_progress:0 "The [scheme|E] gains some progress"
 
